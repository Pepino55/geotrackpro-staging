<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackPro | Vanguard Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #e8ddc7; --accent: #3E63DD; --navy: #0a0f1d; --header-h: 75px; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { margin: 0; background: #f8fafc; color: var(--navy); padding-bottom: 60px; }
        
        /* HEADER & NAVIGATION */
        header { background: var(--gold); height: var(--header-h); position: fixed; top: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 4%; z-index: 9999; }
        .nav-left, .nav-right { display: flex; gap: 8px; align-items: center; }
        
        .btn-v { background: #1e293b; color: white!important; padding: 10px 18px; border-radius: 8px; font-weight: 800; font-size: 0.7rem; border: none; cursor: pointer; text-transform: uppercase; text-decoration: none; }
        .btn-blue { background: var(--accent); }
        .btn-green { background: #059669; }

        /* DROPDOWNS */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 160px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); border-radius: 4px; z-index: 10001; top: 100%; left: 0; }
        .dropdown-content.lang-pos { left: auto; right: 0; }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content button { color: var(--navy); padding: 12px 16px; width: 100%; border: none; background: none; text-align: left; font-weight: 600; font-size: 0.75rem; cursor: pointer; border-bottom: 1px solid #eee; }
        .dropdown-content button:hover { background: #f1f5f9; }

        /* VIEWS */
        .view { display: none; padding-top: var(--header-h); min-height: 100vh; }
        .view.active { display: block; }
        
        /* HERO */
        .hero { background: #888; height: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }

        /* FOOTER */
        footer { background: var(--navy); color: white; height: 50px; position: fixed; bottom: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 4%; font-size: 0.7rem; z-index: 10000; }
        .led-dot { height: 10px; width: 10px; background: #00FF00; border-radius: 50%; box-shadow: 0 0 8px #00FF00; display: inline-block; margin-right: 10px; }
        footer a { color: white; text-decoration: none; margin-left: 15px; }
    </style>
</head>
<body>

<header>
    <div class="nav-left">
        <img src="IMAGES/ui/logo.png" height="35" onclick="nav('home')" style="cursor:pointer">
        <button onclick="nav('home')" class="btn-v" id="nav-home">HOME</button>
        <div class="dropdown">
            <button class="btn-v" id="nav-comp">COMPANY</button>
            <div class="dropdown-content">
                <button onclick="nav('about-us')" id="sub-about">ABOUT US</button>
                <button onclick="nav('partners')" id="sub-partners">OUR PARTNERS</button>
            </div>
        </div>
    </div>
    <div class="nav-right">
        <button onclick="nav('prod-menu')" class="btn-v" id="nav-prod">PRODUCTS</button>
        <button onclick="nav('contact')" class="btn-v" id="nav-cont">CONTACT</button>
        <button onclick="nav('contact')" class="btn-v" id="nav-demo">DEMO REQUEST</button>
        <button onclick="window.open('https://tracksolidpro.com')" class="btn-v btn-blue">PLATFORM</button>
        <div class="dropdown">
            <button class="btn-v" id="lang-btn">🌐 EN</button>
            <div class="dropdown-content lang-pos">
                <button onclick="changeLang('en')">EN</button>
                <button onclick="changeLang('fr')">FR</button>
                <button onclick="changeLang('it')">IT</button>
                <button onclick="changeLang('es')">ES</button>
            </div>
        </div>
    </div>
</header>

<div id="home" class="view active">
    <section class="hero">
        <h1 id="h-title">Innovative Solutions, Built Your Way</h1>
        <p id="h-sub">Manage your fleet & assets in real time from anywhere.</p>
    </section>
</div>

<div id="about-us" class="view"><div style="padding:40px;"><h2>ABOUT US</h2></div></div>
<div id="partners" class="view"><div style="padding:40px;"><h2>PARTNERS</h2></div></div>
<div id="prod-menu" class="view"><div style="padding:40px;"><h2>PRODUCTS</h2></div></div>
<div id="contact" class="view"><div style="padding:40px;"><h2>CONTACT</h2></div></div>

<footer>
    <div>BKO LOGIN</div>
    <div style="display:flex; align-items:center;">
        <span class="led-dot"></span>
        <span id="footer-time"></span>
    </div>
    <div>
        <a href="DOCS/LEGAL/terms.pdf" target="_blank" id="f-term">Terms</a>
        <a href="DOCS/LEGAL/privacy.pdf" target="_blank" id="f-priv">Privacy</a>
    </div>
</footer>

<script>
    const TXT = {
        en: { h: "Innovative Solutions, Built Your Way", sub: "Manage your fleet & assets in real time from anywhere.", home: "HOME", comp: "COMPANY", prod: "PRODUCTS", cont: "CONTACT", demo: "DEMO REQUEST", ab: "ABOUT US", pt: "OUR PARTNERS", tL: "Terms", pL: "Privacy" },
        fr: { h: "Solutions Innovantes, à Votre Façon", sub: "Gérez votre flotte et vos actifs en temps réel.", home: "ACCUEIL", comp: "ENTREPRISE", prod: "PRODUITS", cont: "CONTACT", demo: "DEMANDE DÉMO", ab: "À PROPOS", pt: "PARTENAIRES", tL: "Conditions", pL: "Confidentialité" },
        it: { h: "Soluzioni Innovative, Costruite per Te", sub: "Gestisci la tua flotta e i tuoi asset in tempo reale.", home: "HOME", comp: "AZIENDA", prod: "PRODOTTI", cont: "CONTATTO", demo: "RICHIESTA DEMO", ab: "CHI SIAMO", pt: "PARTNER", tL: "Termini", pL: "Privacy" },
        es: { h: "Soluciones Innovadoras, a su Medida", sub: "Gestione su flota y activos en tiempo real.", home: "INICIO", comp: "EMPRESA", prod: "PRODUCTOS", cont: "CONTACTO", demo: "DEMOSTRACIÓN", ab: "NOSOTROS", pt: "SOCIOS", tL: "Condiciones", pL: "Privacidad" }
    };

    function nav(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }

    function changeLang(l) {
        const t = TXT[l];
        document.getElementById('lang-btn').innerText = "🌐 " + l.toUpperCase();
        document.getElementById('h-title').innerText = t.h;
        document.getElementById('h-sub').innerText = t.sub;
        document.getElementById('nav-home').innerText = t.home;
        document.getElementById('nav-comp').innerText = t.comp;
        document.getElementById('nav-prod').innerText = t.prod;
        document.getElementById('nav-cont').innerText = t.cont;
        document.getElementById('nav-demo').innerText = t.demo;
        document.getElementById('sub-about').innerText = t.ab;
        document.getElementById('sub-partners').innerText = t.pt;
        document.getElementById('f-term').innerText = t.tL;
        document.getElementById('f-priv').innerText = t.pL;
    }

    setInterval(() => {
        const now = new Date();
        document.getElementById('footer-time').innerText = now.toLocaleString();
    }, 1000);

    window.onload = () => { changeLang('en'); };
</script>
</body>
</html>
