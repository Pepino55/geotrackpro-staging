<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackPro | Refined Vanguard v27.0</title>
    <script src="https://cdn.jsdelivr.net/npm/contentful@latest/dist/contentful.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #e8ddc7; --accent: #007bff; --navy: #0a0f1d; --header-h: 80px; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { margin: 0; background: #f8fafc; color: var(--navy); padding-bottom: 80px; }
        
        /* HEADER - SLEEK NAVIGATION */
        header { background: var(--gold); height: var(--header-h); position: fixed; top: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 3%; z-index: 9999; }
        .nav-group { display: flex; align-items: center; gap: 10px; }
        .btn-v { padding: 10px 18px; border-radius: 50px; font-weight: 800; font-size: 0.65rem; border: none; cursor: pointer; text-transform: uppercase; text-decoration: none; transition: 0.2s; color: white!important; }
        .btn-gray { background: #475569; }
        .btn-navy { background: #0f172a; }
        .btn-blue { background: #007bff; }
        .btn-purple { background: #6366f1; }
        .btn-green { background: #10b981; }
        .btn-v:hover { filter: brightness(1.2); transform: translateY(-1px); }

        /* HERO - REFINED BUTTON SIZES */
        .hero { height: 90vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; background: linear-gradient(rgba(10,15,29,0.7), rgba(10,15,29,0.7)), url('IMAGES/ui/hero-bg.jpg') center/cover; }
        .hero h1 { font-size: 5rem; margin: 0; font-weight: 800; letter-spacing: -2px; text-transform: uppercase; }

        /* VIEW CONTAINER */
        .view { display: none; padding: calc(var(--header-h) + 60px) 7%; min-height: 100vh; }
        .view.active { display: block; }

        /* FOOTER & STATUS */
        footer { background: var(--navy); color: white; height: 60px; position: fixed; bottom: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 4%; font-size: 0.7rem; z-index: 10000; }
        .status-led { height: 10px; width: 10px; background: #00FF00; border-radius: 50%; display: inline-block; margin-left: 10px; box-shadow: 0 0 10px #00FF00; }
        .footer-links a { color: #94a3b8; text-decoration: none; margin-left: 20px; font-weight: 600; cursor: pointer; text-transform: uppercase; }
        .footer-links a:hover { color: white; }
    </style>
</head>
<body>

<header>
    <div class="nav-group">
        <img src="IMAGES/ui/logo.png" height="35" onclick="nav('home')" style="cursor:pointer">
        <button onclick="nav('about')" class="btn-v btn-gray">ABOUT US</button>
        <button onclick="nav('home')" class="btn-v btn-navy">HOME</button>
    </div>
    <div class="nav-group">
        <button onclick="nav('prod-menu')" class="btn-v btn-blue">PRODUCTS</button>
        <button onclick="openForm('CONTACT US')" class="btn-v btn-blue">CONTACT</button>
        <button onclick="openForm('DEMO REQUEST')" class="btn-v btn-purple">DEMO REQUEST</button>
        <button onclick="window.open('https://tracksolidpro.com')" class="btn-v btn-green">PLATFORM</button>
    </div>
</header>

<div id="home" class="view active" style="padding:0;">
    <div class="hero">
        <h1>VANGUARD GLOBAL</h1>
        <div style="display:flex; gap:15px; margin-top:30px;">
            <button onclick="nav('prod-menu')" class="btn-v btn-blue" style="padding: 12px 25px;">EXPLORE CATALOG</button>
            <button onclick="openForm('SALES CONSULTATION')" class="btn-v" style="padding: 12px 25px; background:white; color:#0f172a!important; border:1px solid white;">SALES CONSULTATION</button>
        </div>
    </div>
</div>

<footer>
    <div>© 2026 GEOTRACKPRO | <span id="clock"></span> <span class="status-led"></span></div>
    <div class="footer-links">
        <a href="DOCS/TERMS.pdf" target="_blank">TERMS</a>
        <a href="DOCS/PRIVACY.pdf" target="_blank">PRIVACY</a>
    </div>
</footer>

<script>
    // Navigation and Clock Scripts
    function nav(id) { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
    function openForm(t) { nav('contact'); }
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000);
</script>
</body>
</html>
