<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackPro | Vanguard Sovereign</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #e8ddc7; --accent: #3E63DD; --navy: #0a0f1d; --header-h: 80px; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { margin: 0; background: #fcfcfc; color: var(--navy); padding-bottom: 60px; }
        
        header { background: var(--gold); height: var(--header-h); position: fixed; top: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 4%; z-index: 9999; box-shadow: 0 2px 15px rgba(0,0,0,0.08); }
        .logo { height: 40px; cursor: pointer; }
        
        .nav-group { display: flex; gap: 15px; align-items: center; }
        .btn-v { background: var(--accent); color: white!important; padding: 12px 24px; border-radius: 50px; font-weight: 800; font-size: 0.75rem; border: none; cursor: pointer; text-transform: uppercase; text-decoration: none; transition: 0.3s; }
        .btn-v:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .view { display: none; padding: calc(var(--header-h) + 40px) 5%; min-height: 100vh; animation: fadeIn 0.4s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* CATEGORY GRID - REPAIRED */
        .cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px; max-width: 1200px; margin: 40px auto; }
        .cat-card { background: white; padding: 40px 20px; border-radius: 24px; text-align: center; border: 1px solid #eee; cursor: pointer; transition: 0.3s; }
        .cat-card:hover { border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .cat-card span { font-size: 2.5rem; display: block; margin-bottom: 10px; }

        /* PRODUCT LIST */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 24px; border: 1px solid #eef2f6; padding: 25px; display: flex; gap: 20px; height: 300px; }
        .card-img { flex: 0 0 140px; background: #f8fafc; border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 15px; }
        .card-img img { width: 100%; max-height: 160px; object-fit: contain; }
        .card-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }

        /* CONTACT FORM & MAP */
        .contact-container { max-width: 1100px; margin: 0 auto; background: white; border-radius: 30px; border: 1px solid #eee; display: grid; grid-template-columns: 1.2fr 1fr; overflow: hidden; min-height: 600px; }
        .form-side { padding: 50px; position: relative; }
        input, textarea, select { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #ddd; font-size: 1rem; }
        
        footer { background: var(--navy); color: white; height: 60px; position: fixed; bottom: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 4%; font-size: 0.75rem; z-index: 10000; }
        .status-led { height: 10px; width: 10px; background: #00FF00; border-radius: 50%; box-shadow: 0 0 10px #00FF00; display: inline-block; margin-left: 10px; }

        @media (max-width: 900px) { .contact-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <div class="nav-group">
        <img src="IMAGES/ui/logo.png" class="logo" onclick="nav('home')" onerror="this.src='https://via.placeholder.com/200x50?text=GeoTrackPro'">
        <button onclick="nav('home')" class="btn-v">Home</button>
        <button onclick="nav('cat-view')" class="btn-v">Catalog</button>
    </div>
    <div class="nav-group">
        <button onclick="nav('contact')" class="btn-v" style="background:var(--navy)">Contact</button>
        <select id="langSelect" onchange="updateLang(this.value)" style="padding:10px; border-radius:20px; background:var(--accent); color:white; border:none; font-weight:800;">
            <option value="en">EN</option>
            <option value="it">IT</option>
        </select>
    </div>
</header>

<div id="home" class="view active">
    <div style="text-align:center; padding-top:100px;">
        <h1 style="font-size: 4rem; font-weight: 800; margin:0;">VANGUARD GLOBAL</h1>
        <p style="font-size: 1.5rem; color: #64748b; margin: 20px 0 50px;">Strategic Asset Intelligence & Sovereign Telemetry</p>
        <button onclick="nav('cat-view')" class="btn-v" style="padding: 20px 60px; font-size: 1.1rem;">ENTER CATALOG</button>
    </div>
</div>

<div id="cat-view" class="view">
    <h2 style="text-align:center; font-size: 2.5rem;">Operational Categories</h2>
    <div class="cat-grid" id="cat-anchor"></div>
</div>

<div id="list-view" class="view">
    <button onclick="nav('cat-view')" class="btn-v" style="background:#64748b; margin-bottom:30px;">← BACK TO CATEGORIES</button>
    <div class="product-grid" id="gridAnchor"></div>
</div>

<div id="contact" class="view">
    <div class="contact-container">
        <div class="form-side" id="form-container">
            <form id="vanguardForm">
                <input type="hidden" name="access_key" value="8c8df878-746f-4fd6-9847-7c1edff3622c">
                <h2 id="f-header">DIRECT INQUIRY</h2>
                <input type="text" name="name" placeholder="Full Name *" required>
                <input type="email" name="email" placeholder="Business Email *" required>
                <input type="tel" name="phone" placeholder="Phone Number">
                <select name="country" id="country-select" required></select>
                <textarea name="message" rows="5" placeholder="Operational Requirements *" required></textarea>
                <button type="submit" id="submit-btn" class="btn-v" style="width:100%; height:60px; font-size:1rem;">SEND TRANSMISSION</button>
            </form>
        </div>
        <div id="success-state" style="display:none; text-align:center; padding:100px 40px;">
            <div style="font-size: 80px; margin-bottom: 20px;">✅</div>
            <h2>MESSAGE SENT</h2>
            <p style="color:#64748b; margin-bottom:40px;">A Vanguard specialist will review your request shortly.</p>
            <button onclick="resetForm()" class="btn-v">SEND ANOTHER</button>
        </div>
        <div style="background:#f1f5f9;">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2798.123456789!2d9.123456789!3d45.123456789!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDXCsDA3JzM0LjQiTiA5wrAwNyczNC40IkU!5e0!3m2!1sen!2sit!4v1700000000000" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>
</div>

<footer>
    <div>© 2026 GEOTRACKPRO | <span id="clock"></span> <span class="status-led"></span></div>
    <div style="display:flex; gap:30px;">
        <a href="DOCS/LEGAL/terms.pdf" target="_blank" style="color:white; text-decoration:none; font-weight:800;">TERMS</a>
        <a href="DOCS/LEGAL/privacy.pdf" target="_blank" style="color:white; text-decoration:none; font-weight:800;">PRIVACY</a>
    </div>
</footer>

<script>
    const WAREHOUSE = [
        { id: "vl103", cat: "vehicle", name: "VL103", desc: "4G Multimodal LTE Tracker with GNSS." },
        { id: "vl106", cat: "vehicle", name: "VL106", desc: "Advanced LTE Vehicle Terminal." },
        { id: "ll301", cat: "asset", name: "LL301", desc: "Asset GNSS Tracker (10,000mAh)." },
        { id: "jc400", cat: "dashcam", name: "jc400", desc: "Edge AI Dual-Channel Dashcam." },
        { id: "ob22", cat: "obd", name: "OB22", desc: "Plug & Play OBD Tracker." }
    ];

    const CATEGORIES = [
        { id: "vehicle", n: "Vehicle", i: "🚗" },
        { id: "asset", n: "Asset", i: "📦" },
        { id: "dashcam", n: "Dashcam", i: "📹" },
        { id: "obd", n: "OBD", i: "🔌" },
        { id: "motorcycle", n: "Motorcycle", i: "🏍️" },
        { id: "personal", n: "Personal", i: "🏃" }
    ];

    function init() {
        renderCats();
        populateCountries();
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000);
        document.getElementById('vanguardForm').addEventListener('submit', handleSubmission);
    }

    function renderCats() {
        document.getElementById('cat-anchor').innerHTML = CATEGORIES.map(c => `
            <div class="cat-card" onclick="renderList('${c.id}')">
                <span>${c.i}</span>
                <strong>${c.n.toUpperCase()}</strong>
            </div>`).join('');
    }

    function renderList(catId) {
        nav('list-view');
        const items = WAREHOUSE.filter(i => i.cat === catId);
        const anchor = document.getElementById('gridAnchor');
        
        if(items.length === 0) {
            anchor.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:100px;"><h3>CATEGORY COMING SOON</h3></div>`;
            return;
        }

        anchor.innerHTML = items.map(d => `
            <div class="card">
                <div class="card-img">
                    <img src="IMAGES/${d.cat}/${d.id}.png" onerror="this.src='IMAGES/ui/coming-soon.png'">
                </div>
                <div class="card-info">
                    <div><h3 style="margin:0;">${d.name}</h3><p style="color:#64748b; font-size:0.9rem;">${d.desc}</p></div>
                    <div style="display:flex; gap:10px;">
                        <a href="DOCS/SPECS/${d.id}.pdf" target="_blank" class="btn-v" style="background:#64748b; flex:1; text-align:center;">SPECS</a>
                        <button onclick="openForm('${d.name}')" class="btn-v" style="flex:1;">INQUIRY</button>
                    </div>
                </div>
            </div>`).join('');
    }

    function populateCountries() {
        const list = ["Italy", "France", "Spain", "UK", "USA", "Other"];
        document.getElementById('country-select').innerHTML = '<option value="">Select Country *</option>' + 
            list.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function nav(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }

    function openForm(prodName) {
        document.getElementById('f-header').innerText = prodName;
        nav('contact');
    }

    async function handleSubmission(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        btn.disabled = true; btn.innerText = "TRANSMITTING...";

        const formData = new FormData(e.target);
        const response = await fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            body: formData
        });

        if (response.ok) {
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('success-state').style.display = 'block';
        }
    }

    function resetForm() {
        document.getElementById('vanguardForm').reset();
        document.getElementById('form-container').style.display = 'block';
        document.getElementById('success-state').style.display = 'none';
        nav('home');
    }

    window.onload = init;
</script>
</body>
</html>
