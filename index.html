<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackPro | v22.2.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .nav-btn { transition: all 0.2s ease; cursor: pointer; }
        .nav-btn:hover { opacity: 0.8; transform: scale(1.05); }
        .hidden-section { display: none; }
        .active-filter { ring: 2px; ring-color: white; border: 2px solid white; }
    </style>
</head>
<body class="bg-[#f8fafc] font-sans">

    <nav class="bg-[#e5ddd3] p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-6">
                <h1 class="text-2xl font-bold text-[#007bff] cursor-pointer" onclick="showSection('home')">GeoTrackPro<sup>®</sup></h1>
                <div class="hidden lg:flex gap-2">
                    <button class="nav-btn bg-[#4a5568] text-white px-4 py-2 rounded-full uppercase text-xs font-bold" data-i18n="nav_company">Company</button>
                    <button class="nav-btn bg-[#1a202c] text-white px-4 py-2 rounded-full uppercase text-xs font-bold" onclick="showSection('home')" data-i18n="nav_home">Home</button>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <button class="nav-btn bg-[#007bff] text-white px-4 py-2 rounded-full uppercase text-xs font-bold" onclick="filterCatalog('all')" data-i18n="nav_products">Products</button>
                <button class="nav-btn bg-[#007bff] text-white px-4 py-2 rounded-full uppercase text-xs font-bold" onclick="showSection('contact')" data-i18n="nav_contact">Contact Us</button>
                <button class="nav-btn bg-[#6366f1] text-white px-4 py-2 rounded-full uppercase text-xs font-bold" data-i18n="nav_demo">Demo Request</button>
                <button class="nav-btn bg-[#10b981] text-white px-4 py-2 rounded-full uppercase text-xs font-bold">Platform</button>
                
                <select id="langSelector" class="bg-[#007bff] text-white px-3 py-2 rounded-lg font-bold text-xs outline-none border-none cursor-pointer">
                    <option value="en">EN</option>
                    <option value="fr">FR</option>
                    <option value="it">IT</option>
                </select>
            </div>
        </div>
    </nav>

    <header id="hero-section" class="bg-[#1a202c] py-12 text-center text-white">
        <h2 class="text-4xl font-bold mb-6" data-i18n="hero_title">Global Telematics Solutions</h2>
        <div class="flex justify-center gap-4 flex-wrap px-4">
            <button onclick="filterCatalog('vehicle')" class="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded-xl font-bold uppercase text-sm transition-all">Vehicle</button>
            <button onclick="filterCatalog('asset')" class="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded-xl font-bold uppercase text-sm transition-all">Asset</button>
            <button onclick="filterCatalog('tags')" class="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded-xl font-bold uppercase text-sm transition-all">Tags</button>
            <button onclick="filterCatalog('dashcam')" class="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded-xl font-bold uppercase text-sm transition-all">Dashcam</button>
        </div>
    </header>

    <main id="catalog-section" class="max-w-7xl mx-auto py-12 px-4">
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <section id="contact-section" class="hidden-section max-w-7xl mx-auto py-12 px-4">
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col lg:flex-row">
            <div class="p-8 lg:w-1/2">
                <h2 class="text-3xl font-bold mb-6 text-[#007bff]" data-i18n="contact_title">CONTACT US</h2>
                <form class="space-y-4">
                    <input type="text" data-i18n-placeholder="form_name" placeholder="Full Name" class="w-full p-4 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="email" data-i18n-placeholder="form_email" placeholder="Business Email" class="w-full p-4 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                    <textarea data-i18n-placeholder="form_message" placeholder="Message" class="w-full p-4 border rounded-xl h-32 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    <button type="button" class="w-full bg-[#007bff] text-white font-bold py-4 rounded-xl uppercase hover:bg-blue-700 transition-all" data-i18n="form_submit">Submit Request</button>
                </form>
            </div>
            <div class="bg-gray-200 lg:w-1/2 min-h-[400px]">
                <iframe width="100%" height="100%" frameborder="0" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2798.12345!2d9.1900!3d45.4642!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDXCsDI3JzUxLjEiTiA5wrAxMScyNC4wIkU!5e0!3m2!1sen!2sit!4v1620000000000!5m2!1sen!2sit"></iframe>
            </div>
        </div>
    </section>

    <footer class="bg-[#0f172a] text-white mt-12 py-8">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center text-[10px] opacity-60">
            <div>© 2026 GEOTRACKPRO | <span id="clock"></span> | v22.2.6</div>
            <div class="flex gap-4 font-bold uppercase">
                <a href="#">Terms</a>
                <a href="#">Privacy</a>
            </div>
        </div>
    </footer>

    <script>
        const WAREHOUSE = [
            { id: "VL103", cat: ["vehicle"], name: "VL103", desc: "Hardwired vehicle tracker LTE GNSS." },
            { id: "VL106", cat: ["vehicle"], name: "VL106", desc: "LTE vehicle tracker with INS-aided GPS." },
            { id: "PB706", cat: ["tags"], name: "PB706", desc: "BT crowdsourcing network tag." },
            { id: "LL309", cat: ["tags"], name: "LL309", desc: "Asset location tag." },
            { id: "JC450", cat: ["dashcam"], name: "JC450", desc: "Multi-channel ADAS dashcam." }
        ];

        const TRANSLATIONS = {
            en: { nav_products: "Products", nav_contact: "Contact Us", hero_title: "Global Telematics", contact_title: "CONTACT US", form_submit: "Submit Request" },
            fr: { nav_products: "Produits", nav_contact: "Contact", hero_title: "Télématique Mondiale", contact_title: "CONTACTEZ-NOUS", form_submit: "Envoyer" },
            it: { nav_products: "Prodotti", nav_contact: "Contatti", hero_title: "Telematica Globale", contact_title: "CONTATTACI", form_submit: "Invia" }
        };

        function showSection(section) {
            const catalog = document.getElementById('catalog-section');
            const contact = document.getElementById('contact-section');
            const hero = document.getElementById('hero-section');

            if(section === 'contact') {
                catalog.classList.add('hidden-section');
                hero.classList.add('hidden-section');
                contact.classList.remove('hidden-section');
            } else {
                catalog.classList.remove('hidden-section');
                hero.classList.remove('hidden-section');
                contact.classList.add('hidden-section');
                renderCatalog('all');
            }
        }

        function renderCatalog(filter = 'all') {
            const grid = document.getElementById('product-grid');
            const filteredData = filter === 'all' ? WAREHOUSE : WAREHOUSE.filter(i => i.cat.includes(filter));
            
            grid.innerHTML = filteredData.map(item => {
                // RIGID PATH LOGIC: /IMAGES/[folder]/[id]_01.png
                const folder = item.cat[0];
                const fileName = `${item.id.toLowerCase()}_01.png`;
                const imgPath = `IMAGES/${folder}/${fileName}`;

                return `
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 hover:shadow-lg transition-all flex items-center gap-6">
                        <div class="w-24 h-24 flex-shrink-0">
                            <img src="${imgPath}" onerror="this.src='https://placehold.co/200x200?text=No+Image'" class="w-full h-full object-contain">
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">${item.name}</h3>
                            <p class="text-gray-500 text-xs mb-3">${item.desc}</p>
                            <div class="flex gap-2">
                                <button class="bg-slate-200 text-slate-700 px-3 py-1 rounded-full text-[10px] font-bold uppercase">Specs</button>
                                <button class="bg-blue-500 text-white px-3 py-1 rounded-full text-[10px] font-bold uppercase">Inquiry</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterCatalog(category) {
            showSection('home');
            renderCatalog(category);
        }

        function updateLang(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (TRANSLATIONS[lang][key]) el.innerText = TRANSLATIONS[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (TRANSLATIONS[lang][key]) el.placeholder = TRANSLATIONS[lang][key];
            });
        }

        // Initialize
        document.getElementById('langSelector').addEventListener('change', (e) => updateLang(e.target.value));
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000);
        
        renderCatalog();
        updateLang('en');
    </script>
</body>
</html>
