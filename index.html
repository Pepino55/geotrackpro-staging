<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackPro | Vanguard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">GeoTrackPro®</div>
        <div class="nav-links">
            <button onclick="nav('home')">HOME</button>
            <button onclick="nav('contact')">CONTACT</button>
            <select id="langSelect" onchange="updateLang(this.value)">
                <option value="en">EN</option>
                <option value="it">IT</option>
                <option value="fr">FR</option>
                <option value="es">ES</option>
            </select>
        </div>
    </nav>

    <main>
        <section id="view-home" class="view">
            <h1>VANGUARD GLOBAL</h1>
        </section>

        <section id="view-contact" class="view hidden">
            <h1>CONNECT</h1>
            <form id="vanguardForm">
                <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
                <div class="form-grid">
                    <input type="text" name="name" placeholder="Full Name *" required>
                    <input type="email" name="email" placeholder="Business Email *" required>
                    <textarea name="message" placeholder="Message *" required></textarea>
                </div>
                <button type="submit" id="btn-submit">SEND INQUIRY</button>
            </form>
        </section>
    </main>

    <div id="toast" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:black; color:white; padding:15px; border-radius:5px;"></div>

    <footer class="vanguard-footer">
        <div class="footer-left">
            <span id="footer-clock"></span>
            <span class="status-dot"></span>
        </div>
        <div class="footer-right">
            <a href="terms.pdf" target="_blank" class="footer-link">TERMS</a>
            <a href="privacy.pdf" target="_blank" class="footer-link">PRIVACY</a>
        </div>
    </footer>

    <script src="Main.js"></script>
</body>
</html>
