<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackPro | Sovereign Build</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #3E63DD; --navy: #0a0f1d; --gold: #e8ddc7; --footer-bg: #05070a; }
        
        /* 1. THE "ROCK" FOUNDATION */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        main { flex: 1; position: relative; }

        /* 2. ANCHORED HEADER [cite: 1159] */
        header { 
            background: var(--gold); height: 80px; display: flex; align-items: center; justify-content: space-between; 
            padding: 0 4%; position: sticky; top: 0; z-index: 9999; box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        .logo { height: 32px; cursor: pointer; }

        .nav-zone { display: flex; gap: 5px; align-items: center; }
        .drop-btn { 
            position: relative; height: 45px; padding: 0 12px; background: #2d3748; color: white; 
            border: none; border-radius: 4px; font-weight: 800; font-size: 0.65rem; text-transform: uppercase; cursor: pointer;
        }
        .drop-content { 
            display: none; position: absolute; top: 100%; left: 0; background: white; 
            min-width: 160px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border-radius: 4px; z-index: 10001;
        }
        .drop-btn:hover .drop-content { display: block; }
        .drop-content a { color: var(--navy); padding: 12px 16px; text-decoration: none; display: block; font-size: 0.7rem; border-bottom: 1px solid #eee; }
        .drop-content a:hover { background: #f1f1f1; }

        /* 3. ANCHORED FOOTER  */
        footer { 
            background: var(--footer-bg); color: white; padding: 20px 4%; display: flex; 
            justify-content: space-between; align-items: center; font-size: 0.7rem; border-top: 2px solid var(--accent);
        }
        .led { height: 8px; width: 8px; background: #00ff00; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #00ff00; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* 4. VIEW LOGIC */
        .view { display: none; padding: 40px 6%; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 5. FORMS & CATALOG [cite: 1242, 1307] */
        .grid-cat { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; text-align: center; }
        .card img { max-width: 100%; height: 180px; object-fit: contain; }
        
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <img src="IMAGES/ui/logo.png" class="logo" onclick="nav('home')" onerror="this.src='https://via.placeholder.com/150x40?text=LOGO'">
    <div class="nav-zone">
        <button class="drop-btn" onclick="nav('home')" data-t="h_home">Home</button>
        <div class="drop-btn"><span data-t="h_comp">Company</span>
            <div class="drop-content">
                <a href="#" onclick="nav('about')" data-t="h_about">About Us</a>
                <a href="#" onclick="nav('partners')" data-t="h_part">Partners</a>
            </div>
        </div>
        <div class="drop-btn"><span data-t="h_sol">Solutions</span>
            <div class="drop-content">
                <a href="#" onclick="filterCat('asset')" data-t="s_asset">Asset Management</a>
                <a href="#" onclick="filterCat('fleet')" data-t="s_fleet">Fleet Telematics</a>
            </div>
        </div>
        <div class="drop-btn"><span data-t="h_prod">Products</span>
            <div class="drop-content">
                <a href="#" onclick="renderCatalog('all')" data-t="p_all">View All</a>
                <a href="#" onclick="renderCatalog('vehicle')">Vehicle</a>
                <a href="#" onclick="renderCatalog('asset')">Asset</a>
                <a href="#" onclick="renderCatalog('dashcam')">DashCam</a>
            </div>
        </div>
        <button class="drop-btn" onclick="nav('contact')" data-t="h_cont">Contact</button>
        <button class="drop-btn" style="background:var(--accent)" onclick="window.open('https://www.tracksolidpro.com')">Platform</button>
        <div class="drop-btn">🌐 <span id="cur-l">EN</span>
            <div class="drop-content">
                <a href="#" onclick="setL('en')">EN</a>
                <a href="#" onclick="setL('fr')">FR</a>
                <a href="#" onclick="setL('it')">IT</a>
                <a href="#" onclick="setL('es')">ES</a>
            </div>
        </div>
    </div>
</header>

<main>
    <div id="v-home" class="view active">
        <h1 data-t="slogan">Innovative Solutions, Built Your Way</h1>
    </div>

    <div id="v-catalog" class="view">
        <h2 id="cat-title" data-t="p_all">View All</h2>
        <div class="grid-cat" id="cat-anchor"></div>
    </div>

    <div id="v-contact" class="view">
        <h2 data-t="con_title">Get In Touch With Us</h2>
        <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="8c8df878-746f-4fd6-9847-7c1edff3622c">
            <input type="text" name="name" placeholder="Your Name*" required>
            <input type="email" name="email" placeholder="E-mail*" required>
            <input type="text" name="phone" placeholder="Phone*" required>
            <input type="text" name="country" placeholder="Country*" required>
            <select name="product_interest">
                <option value="Vehicle">Vehicle</option>
                <option value="Asset">Asset</option>
                <option value="DashCam">DashCam</option>
            </select>
            <textarea name="message" placeholder="Your Message*" required></textarea>
            <button type="submit" class="drop-btn" style="width:100%; background:var(--accent)">SUBMIT</button>
        </form>
    </div>
</main>

<footer>
    <div><span class="led"></span> <span data-t="f_alive">SYSTEM ALIVE</span> | v1.0.4</div>
    <div id="clock"></div>
    <div>
        <a href="#" style="color:white; margin-right:10px;" data-t="f_terms">Terms</a>
        <a href="#" style="color:white;" data-t="f_priv">Privacy</a>
    </div>
</footer>

<script>
    const DICT = {
        en: { h_home: "Home", h_comp: "Company", h_about: "About Us", h_part: "Partners", h_sol: "Solutions", s_asset: "Asset Management", s_fleet: "Fleet Telematics", h_prod: "Products", p_all: "View All", h_cont: "Contact", slogan: "Innovative Solutions, Built Your Way", con_title: "Get In Touch", f_alive: "SYSTEM ACTIVE", f_terms: "Terms", f_priv: "Privacy" },
        fr: { h_home: "Accueil", h_comp: "Entreprise", h_about: "À Propos", h_part: "Partenaires", h_sol: "Solutions", s_asset: "Gestion d'Actifs", s_fleet: "Télématique de Flotte", h_prod: "Produits", p_all: "Voir Tout", h_cont: "Contact", slogan: "Solutions Innovantes, À Votre Façon", con_title: "Contactez-nous", f_alive: "SYSTÈME ACTIF", f_terms: "Conditions", f_priv: "Confidentialité" },
        it: { h_home: "Home", h_comp: "Azienda", h_about: "Chi Siamo", h_part: "Partner", h_sol: "Soluzioni", s_asset: "Gestione Asset", s_fleet: "Telematica Flotta", h_prod: "Prodotti", p_all: "Vedi Tutto", h_cont: "Contatti", slogan: "Soluzioni Innovative, Costruite per Te", con_title: "Contattaci", f_alive: "SISTEMA ATTIVO", f_terms: "Termini", f_priv: "Privacy" }
    };

    let activeL = 'en';

    function nav(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('v-' + id).classList.add('active');
        window.scrollTo(0,0);
    }

    function setL(l) {
        activeL = l;
        document.getElementById('cur-l').innerText = l.toUpperCase();
        document.querySelectorAll('[data-t]').forEach(el => {
            const key = el.getAttribute('data-t');
            if(DICT[l][key]) el.innerText = DICT[l][key];
        });
    }

    function renderCatalog(cat) {
        nav('catalog');
        const anchor = document.getElementById('cat-anchor');
        const list = (cat === 'all') ? ['vehicle', 'asset', 'dashcam'] : [cat];
        anchor.innerHTML = list.map(c => `
            <div class="card">
                <img src="IMAGES/${c.toUpperCase()}/sample.png" onerror="this.src='https://via.placeholder.com/200x150?text=${c}'">
                <h3>${c.toUpperCase()} Device</h3>
                <button class="drop-btn" style="width:100%; margin-top:10px;" onclick="nav('contact')">Specs / Query</button>
            </div>
        `).join('');
    }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000);
    window.onload = () => setL('en');
</script>
</body>
</html>
