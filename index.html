<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackPro | Global Telematics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #007bff; --secondary: #2d3748; --accent: #10b981; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .nav-btn { transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        /* Fix for the Contact Form visibility */
        #contact-section { min-height: 600px; display: flex; flex-direction: column; }
        .contact-container { flex: 1; display: flex; flex-wrap: wrap; gap: 2rem; }
        .map-container { flex: 1; min-width: 300px; min-height: 400px; border-radius: 1rem; overflow: hidden; }
        .form-container { flex: 1; min-width: 300px; }
    </style>
</head>
<body>
    <nav class="bg-[#e5ddd3] p-4 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-8">
                <h1 class="text-2xl font-bold text-[#007bff]">GeoTrackPro<sup>®</sup></h1>
                <div class="hidden md:flex gap-4">
                    <button data-i18n="nav_company" class="nav-btn bg-[#4a5568] text-white px-4 py-2 rounded-full uppercase text-sm font-bold">Company</button>
                    <button data-i18n="nav_home" class="nav-btn bg-[#1a202c] text-white px-4 py-2 rounded-full uppercase text-sm font-bold">Home</button>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button data-i18n="nav_products" class="nav-btn bg-[#007bff] text-white px-4 py-2 rounded-full uppercase text-sm font-bold">Products</button>
                <button data-i18n="nav_contact" class="nav-btn bg-[#007bff] text-white px-4 py-2 rounded-full uppercase text-sm font-bold">Contact Us</button>
                <button data-i18n="nav_demo" class="nav-btn bg-[#6366f1] text-white px-4 py-2 rounded-full uppercase text-sm font-bold">Demo Request</button>
                <button data-i18n="nav_platform" class="nav-btn bg-[#10b981] text-white px-4 py-2 rounded-full uppercase text-sm font-bold">Platform</button>
                <select id="langSelector" class="bg-[#007bff] text-white px-2 py-2 rounded-lg font-bold outline-none border-none cursor-pointer">
                    <option value="en">EN</option>
                    <option value="fr">FR</option>
                    <option value="it">IT</option>
                </select>
            </div>
        </div>
    </nav>

    <section class="max-w-7xl mx-auto py-12 px-4">
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </section>

    <section id="contact-section" class="max-w-7xl mx-auto py-12 px-4 bg-white rounded-3xl shadow-lg my-12">
        <h2 id="contact-title" data-i18n="contact_title" class="text-3xl font-bold mb-8 px-4">CONTACT US</h2>
        <div class="contact-container px-4">
            <div class="form-container">
                <form id="contactForm" class="flex flex-col gap-4">
                    <input type="text" data-i18n-placeholder="form_name" placeholder="Full Name" class="p-4 border rounded-xl outline-none focus:border-[#007bff]" required>
                    <input type="text" data-i18n-placeholder="form_company" placeholder="Company Name" class="p-4 border rounded-xl outline-none focus:border-[#007bff]" required>
                    <input type="email" data-i18n-placeholder="form_email" placeholder="Business Email" class="p-4 border rounded-xl outline-none focus:border-[#007bff]" required>
                    <input type="tel" data-i18n-placeholder="form_phone" placeholder="Phone" class="p-4 border rounded-xl outline-none focus:border-[#007bff]">
                    <select class="p-4 border rounded-xl outline-none bg-white">
                        <option value="" data-i18n="form_select_country">Select Country</option>
                        <option value="FR">France</option>
                        <option value="IT">Italy</option>
                    </select>
                    <textarea data-i18n-placeholder="form_message" placeholder="How can we help?" class="p-4 border rounded-xl h-32 outline-none focus:border-[#007bff]" required></textarea>
                    <button type="submit" data-i18n="form_submit" class="bg-[#007bff] text-white font-bold py-4 rounded-full hover:bg-blue-600 transition-colors uppercase shadow-lg">Submit Request</button>
                </form>
            </div>
            <div class="map-container">
                <iframe 
                    width="100%" 
                    height="100%" 
                    frameborder="0" 
                    style="border:0"
                    src="https://www.google.com/maps/embed/v1/place?key=YOUR_API_KEY&q=Piazza+del+Duomo,Milan+Italy" allowfullscreen>
                </iframe>
            </div>
        </div>
    </section>

    <footer class="bg-[#0f172a] text-white py-6">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center text-xs opacity-70">
            <div>© 2026 GEOTRACKPRO | <span id="current-time"></span> | v22.2.5</div>
            <div class="flex gap-4 uppercase font-bold">
                <a href="#">Terms</a>
                <a href="#">Privacy</a>
            </div>
        </div>
    </footer>

    <script>
        const WAREHOUSE = [
            { id: "VL103", imgCount: 1, cat: ["vehicle"], name: "VL103", desc: "Hardwired vehicle tracker LTE GNSS." },
            { id: "VL106", imgCount: 1, cat: ["vehicle"], name: "VL106", desc: "LTE vehicle tracker with INS-aided GPS." },
            { id: "PB706", imgCount: 3, cat: ["tags"], name: "PB706", desc: "BT crowdsourcing network tag." },
            { id: "LL309", imgCount: 5, cat: ["tags"], name: "LL309", desc: "Asset location tag." }
        ];

        const TRANSLATIONS = {
            en: { 
                nav_products: "Products", nav_contact: "Contact Us", contact_title: "CONTACT US",
                form_name: "Full Name", form_submit: "Submit Request"
            },
            fr: { 
                nav_products: "Produits", nav_contact: "Contact", contact_title: "CONTACTEZ-NOUS",
                form_name: "Nom Complet", form_submit: "Envoyer la demande"
            },
            it: { 
                nav_products: "Prodotti", nav_contact: "Contatti", contact_title: "CONTATTACI",
                form_name: "Nome Completo", form_submit: "Invia Richiesta"
            }
        };

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = WAREHOUSE.map(item => {
                // FIXED LOGIC: Folder / ID lowercase / Padded index
                const folder = item.cat[0];
                const fileName = `${item.id.toLowerCase()}_01.png`;
                const imgPath = `IMAGES/${folder}/${fileName}`;

                return `
                    <div class="product-card bg-white p-6 rounded-3xl flex items-center gap-6">
                        <div class="w-32 h-32 flex-shrink-0">
                            <img src="${imgPath}" onerror="this.src='https://placehold.co/200x200?text=Photo+Coming+Soon'" 
                                 class="w-full h-full object-contain">
                        </div>
                        <div class="flex-1">
                            <h3 class="text-xl font-bold">${item.name}</h3>
                            <p class="text-gray-500 text-sm mb-4">${item.desc}</p>
                            <div class="flex gap-2">
                                <button class="bg-slate-500 text-white px-4 py-1 rounded-full text-xs font-bold uppercase">Specs</button>
                                <button class="bg-[#007bff] text-white px-4 py-1 rounded-full text-xs font-bold uppercase">Inquiry</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateLang(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (TRANSLATIONS[lang][key]) el.innerText = TRANSLATIONS[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (TRANSLATIONS[lang][key]) el.placeholder = TRANSLATIONS[lang][key];
            });
        }

        document.getElementById('langSelector').addEventListener('change', (e) => updateLang(e.target.value));
        
        // Init
        renderProducts();
        updateLang('en');
        document.getElementById('current-time').innerText = new Date().toLocaleString();
    </script>
</body>
</html>
