<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackPro | v22.2.7 Restoration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .section-hidden { display: none; }
        .nav-btn { cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.75rem; transition: 0.2s; }
        .nav-btn:hover { filter: brightness(1.1); }
    </style>
</head>
<body class="bg-[#f2efe9] text-slate-800">

    <nav class="bg-[#e5ddd3] p-4 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex gap-4">
                <h1 class="text-2xl font-black text-[#007bff] mr-4">GeoTrackPro<sup>®</sup></h1>
                <button class="nav-btn bg-[#4a5568] text-white px-5 py-2 rounded-full" data-i18n="nav_company">Company</button>
                <button class="nav-btn bg-[#1a202c] text-white px-5 py-2 rounded-full" onclick="showSection('home')" data-i18n="nav_home">Home</button>
            </div>
            <div class="flex gap-2">
                <button class="nav-btn bg-[#007bff] text-white px-5 py-2 rounded-full" onclick="showSection('catalog')" data-i18n="nav_products">Products</button>
                <button class="nav-btn bg-[#007bff] text-white px-5 py-2 rounded-full" onclick="showSection('contact')" data-i18n="nav_contact">Contact Us</button>
                <button class="nav-btn bg-[#6366f1] text-white px-5 py-2 rounded-full" data-i18n="nav_demo">Demo Request</button>
                <button class="nav-btn bg-[#10b981] text-white px-5 py-2 rounded-full">Platform</button>
                <select id="langSelector" class="bg-[#007bff] text-white px-3 py-2 rounded-lg outline-none cursor-pointer font-bold">
                    <option value="en">EN</option>
                    <option value="fr">FR</option>
                    <option value="it">IT</option>
                </select>
            </div>
        </div>
    </nav>

    <div id="main-content" class="max-w-7xl mx-auto py-10 px-4">
        
        <div id="catalog-page" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>

        <div id="contact-page" class="section-hidden bg-white p-10 rounded-3xl shadow-lg flex flex-col md:flex-row gap-10">
            <div class="flex-1">
                <h2 class="text-3xl font-bold mb-6" data-i18n="contact_title">CONTACT US</h2>
                <form class="flex flex-col gap-4">
                    <input type="text" data-i18n-placeholder="form_name" placeholder="Name" class="p-4 border rounded-xl outline-none">
                    <input type="email" placeholder="Email" class="p-4 border rounded-xl outline-none">
                    <textarea data-i18n-placeholder="form_message" placeholder="Message" class="p-4 border rounded-xl h-40 outline-none"></textarea>
                    <button class="bg-[#007bff] text-white font-bold py-4 rounded-full uppercase shadow-lg" data-i18n="form_submit">Submit Request</button>
                </form>
            </div>
            <div class="flex-1 min-h-[400px] rounded-2xl overflow-hidden border">
                <iframe width="100%" height="100%" frameborder="0" src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d2798.123456789!2d9.191383!3d45.464211!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sfr!4v1700000000000"></iframe>
            </div>
        </div>

    </div>

    <footer class="bg-[#0f172a] text-white p-6 mt-10">
        <div class="max-w-7xl mx-auto flex justify-between items-center text-[10px] opacity-50">
            <div>© 2026 GEOTRACKPRO | <span id="time-display"></span> | v22.2.7</div>
            <div class="flex gap-4 uppercase font-bold">
                <a href="#">Terms</a>
                <a href="#">Privacy</a>
            </div>
        </div>
    </footer>

    <script>
        const WAREHOUSE = [
            { id: "VL103", cat: ["vehicle"], name: "VL103", desc: "Hardwired vehicle tracker LTE GNSS." },
            { id: "VL106", cat: ["vehicle"], name: "VL106", desc: "LTE vehicle tracker even in weak GPS areas." },
            { id: "PB706", cat: ["tags"], name: "PB706", desc: "BT crowdsourcing network tag." },
            { id: "LL309", cat: ["tags"], name: "LL309", desc: "Asset location tag." }
        ];

        const TRANSLATIONS = {
            en: { nav_home: "Home", nav_products: "Products", nav_contact: "Contact Us", contact_title: "CONTACT US", form_submit: "Submit Request" },
            fr: { nav_home: "Accueil", nav_products: "Produits", nav_contact: "Contact", contact_title: "CONTACTEZ-NOUS", form_submit: "Envoyer" },
            it: { nav_home: "Home", nav_products: "Prodotti", nav_contact: "Contatti", contact_title: "CONTATTACI", form_submit: "Invia Richiesta" }
        };

        function showSection(name) {
            document.getElementById('catalog-page').classList.add('section-hidden');
            document.getElementById('contact-page').classList.add('section-hidden');
            
            if(name === 'contact') {
                document.getElementById('contact-page').classList.remove('section-hidden');
            } else {
                document.getElementById('catalog-page').classList.remove('section-hidden');
                renderCatalog();
            }
        }

        function renderCatalog() {
            const grid = document.getElementById('catalog-page');
            grid.innerHTML = WAREHOUSE.map(item => {
                const imgPath = `IMAGES/${item.cat[0]}/${item.id.toLowerCase()}_01.png`;
                return `
                    <div class="bg-white p-6 rounded-3xl shadow-sm flex items-center gap-6">
                        <div class="w-24 h-24 flex-shrink-0">
                            <img src="${imgPath}" onerror="this.src='https://placehold.co/200x200?text=No+Photo'" class="w-full h-full object-contain">
                        </div>
                        <div>
                            <h3 class="text-lg font-bold">${item.name}</h3>
                            <p class="text-xs text-gray-500 mb-4">${item.desc}</p>
                            <div class="flex gap-2">
                                <button class="bg-slate-200 px-3 py-1 rounded-full text-[10px] font-bold">SPECS</button>
                                <button class="bg-[#007bff] text-white px-3 py-1 rounded-full text-[10px] font-bold">INQUIRY</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setLanguage(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(TRANSLATIONS[lang][key]) el.innerText = TRANSLATIONS[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if(TRANSLATIONS[lang][key]) el.placeholder = TRANSLATIONS[lang][key];
            });
        }

        document.getElementById('langSelector').addEventListener('change', (e) => setLanguage(e.target.value));
        setInterval(() => { document.getElementById('time-display').innerText = new Date().toLocaleString(); }, 1000);

        // Initial Load
        renderCatalog();
        setLanguage('en');
    </script>
</body>
</html>
