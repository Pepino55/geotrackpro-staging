<!DOCTYPE html>

    <style>
        :root { --gold: #e8ddc7; --accent: #3E63DD; --navy: #0a0f1d; --header-h: 75px; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { margin: 0; background: #f8fafc; color: var(--navy); padding-bottom: 80px; }
        
        header { background: var(--gold); height: var(--header-h); position: fixed; top: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 4%; z-index: 9999; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .nav-group { display: flex; align-items: center; gap: 10px; }
        
        .btn-v { background: var(--accent); color: white!important; padding: 10px 16px; border-radius: 50px; font-weight: 800; font-size: 0.7rem; border: none; cursor: pointer; text-decoration: none; text-transform: uppercase; }
        
        .dropdown { position: relative; display: inline-block; }
        .drop-content { display: none; position: absolute; background: white; min-width: 160px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); border-radius: 8px; top: 100%; left: 0; overflow: hidden; }
        .dropdown:hover .drop-content { display: block; }
        .drop-content button { width: 100%; padding: 12px; border: none; background: none; text-align: left; cursor: pointer; font-size: 0.75rem; border-bottom: 1px solid #eee; }

        .view { display: none; padding: calc(var(--header-h) + 30px) 5%; min-height: 100vh; }
        .view.active { display: block; }
        
        .hero { background: #0a0f1d; height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 20px; padding: 20px; border: 1px solid #eee; display: flex; gap: 15px; height: 280px; }
        .card-img { flex: 0 0 110px; background: #f9f9f9; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .card-img img { width: 90%; object-fit: contain; }

        footer { background: var(--navy); color: white; height: 60px; position: fixed; bottom: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 4%; font-size: 0.7rem; z-index: 10000; }
        .led-dot { height: 8px; width: 8px; background: #00FF00; border-radius: 50%; display: inline-block; margin-left: 5px; box-shadow: 0 0 5px #00FF00; }
    </style>
</head>
