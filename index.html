<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackPro | v22.2.9 Carousel Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .page-section { display: none; }
        .page-section.active { display: block; }
        .nav-btn { cursor: pointer; transition: 0.2s; }
        .nav-btn:hover { opacity: 0.8; transform: translateY(-1px); }
        .carousel-btn { background: rgba(0, 123, 255, 0.1); border-radius: 50%; width: 30px; height: 30px; display: flex; items-center: center; justify-content: center; transition: 0.3s; }
        .carousel-btn:hover { background: rgba(0, 123, 255, 0.3); }
    </style>
</head>
<body class="bg-[#f2efe9] text-slate-800">

    <nav class="bg-[#e5ddd3] p-4 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-black text-[#007bff] mr-4 cursor-pointer" onclick="showPage('home')">GeoTrackPro<sup>®</sup></h1>
                <button class="nav-btn bg-[#4a5568] text-white px-5 py-2 rounded-full uppercase text-[10px] font-bold" data-i18n="nav_company">Company</button>
                <button class="nav-btn bg-[#1a202c] text-white px-5 py-2 rounded-full uppercase text-[10px] font-bold" onclick="showPage('home')" data-i18n="nav_home">Home</button>
            </div>
            <div class="flex gap-2 items-center">
                <button class="nav-btn bg-[#007bff] text-white px-5 py-2 rounded-full uppercase text-[10px] font-bold" onclick="showPage('home')" data-i18n="nav_products">Products</button>
                <button class="nav-btn bg-[#007bff] text-white px-5 py-2 rounded-full uppercase text-[10px] font-bold" onclick="showPage('contact')" data-i18n="nav_contact">Contact Us</button>
                <button class="nav-btn bg-[#6366f1] text-white px-5 py-2 rounded-full uppercase text-[10px] font-bold" data-i18n="nav_demo">Demo Request</button>
                <button class="nav-btn bg-[#10b981] text-white px-5 py-2 rounded-full uppercase text-[10px] font-bold">Platform</button>
                <select id="langSelector" class="bg-[#007bff] text-white px-3 py-2 rounded-lg outline-none cursor-pointer font-bold text-xs">
                    <option value="en">EN</option>
                    <option value="fr">FR</option>
                    <option value="it">IT</option>
                    <option value="es">ES</option>
                </select>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-10 px-4">
        
        <div id="home-page" class="page-section active">
            <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                </div>
        </div>

        <div id="contact-page" class="page-section bg-white p-10 rounded-3xl shadow-xl flex flex-col lg:flex-row gap-10">
            <div class="flex-1">
                <h2 class="text-3xl font-bold mb-6 text-[#007bff]" data-i18n="contact_title">CONTACT US</h2>
                <form class="flex flex-col gap-4">
                    <input type="text" data-i18n-placeholder="form_name" placeholder="Full Name" class="p-4 border rounded-xl outline-none">
                    <input type="email" placeholder="Business Email" class="p-4 border rounded-xl outline-none">
                    <textarea data-i18n-placeholder="form_message" placeholder="Message" class="p-4 border rounded-xl h-44 outline-none"></textarea>
                    <button type="button" class="bg-[#007bff] text-white font-bold py-4 rounded-full uppercase shadow-lg" data-i18n="form_submit">Submit Request</button>
                </form>
            </div>
            <div class="flex-1 min-h-[450px] rounded-2xl overflow-hidden border">
                <iframe width="100%" height="100%" frameborder="0" src="https://maps.google.com/maps?q=45.4642,9.1900&z=15&output=embed"></iframe>
            </div>
        </div>

    </main>

    <footer class="bg-[#0f172a] text-white p-6 mt-12">
        <div class="max-w-7xl mx-auto flex justify-between items-center text-[10px] opacity-40">
            <div>© 2026 GEOTRACKPRO | <span id="clock"></span> | v22.2.9</div>
            <div class="flex gap-4 uppercase font-bold text-white/60">
                <a href="#">Terms</a>
                <a href="#">Privacy</a>
            </div>
        </div>
    </footer>

    <script>
        // Use your updated WAREHOUSE here
        const WAREHOUSE = [
            { id: "VL103", imgCount: 1, cat: ["vehicle"], name: "VL103", desc: "Hardwired vehicle tracker LTE GNSS." },
            { id: "LL309", imgCount: 5, cat: ["tags"], name: "LL309", desc: "Asset location tag." },
            { id: "PB706", imgCount: 3, cat: ["tags"], name: "PB706", desc: "BT crowdsourcing network tag." }
        ];

        // Global state for carousels
        const carouselState = {};

        const TRANSLATIONS = {
            en: { nav_home: "Home", nav_products: "Products", nav_contact: "Contact Us", contact_title: "CONTACT US", form_submit: "Submit Request", form_name: "Full Name", form_message: "Your Message" },
            fr: { nav_home: "Accueil", nav_products: "Produits", nav_contact: "Contact", contact_title: "CONTACTEZ-NOUS", form_submit: "Envoyer", form_name: "Nom Complet", form_message: "Votre Message" },
            it: { nav_home: "Home", nav_products: "Prodotti", nav_contact: "Contatti", contact_title: "CONTATTACI", form_submit: "Invia Richiesta", form_name: "Nome Completo", form_message: "Tuo Messaggio" },
            es: { nav_home: "Inicio", nav_products: "Productos", nav_contact: "Contáctenos", contact_title: "CONTÁCTENOS", form_submit: "Enviar solicitud", form_name: "Nombre completo", form_message: "Su mensaje" }
        };

        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.getElementById(pageId + '-page').classList.add('active');
        }

        function updateCarouselImage(productId, direction, max) {
            if (!carouselState[productId]) carouselState[productId] = 1;
            
            carouselState[productId] += direction;
            if (carouselState[productId] > max) carouselState[productId] = 1;
            if (carouselState[productId] < 1) carouselState[productId] = max;

            const imgEl = document.getElementById(`img-${productId}`);
            const item = WAREHOUSE.find(i => i.id === productId);
            const folder = item.cat[0];
            const paddedIndex = String(carouselState[productId]).padStart(2, '0');
            imgEl.src = `IMAGES/${folder}/${productId.toLowerCase()}_${paddedIndex}.png`;
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = WAREHOUSE.map(item => {
                const folder = item.cat[0];
                const initialPath = `IMAGES/${folder}/${item.id.toLowerCase()}_01.png`;
                const hasMultiple = item.imgCount > 1;

                return `
                    <div class="bg-white p-6 rounded-3xl shadow-sm flex items-center gap-6 relative">
                        <div class="w-32 h-32 flex-shrink-0 flex flex-col items-center justify-center relative">
                            <img id="img-${item.id}" src="${initialPath}" onerror="this.src='https://placehold.co/200x200?text=No+Photo'" class="w-full h-full object-contain">
                            ${hasMultiple ? `
                                <div class="absolute bottom-[-10px] flex gap-4">
                                    <button onclick="updateCarouselImage('${item.id}', -1, ${item.imgCount})" class="carousel-btn text-[#007bff] font-bold"><</button>
                                    <button onclick="updateCarouselImage('${item.id}', 1, ${item.imgCount})" class="carousel-btn text-[#007bff] font-bold">></button>
                                </div>
                            ` : ''}
                        </div>
                        <div>
                            <h3 class="text-xl font-bold">${item.name}</h3>
                            <p class="text-[11px] text-gray-500 mb-4">${item.desc}</p>
                            <div class="flex gap-2">
                                <button class="bg-slate-200 px-4 py-1.5 rounded-full text-[10px] font-black uppercase">Specs</button>
                                <button class="bg-[#007bff] text-white px-4 py-1.5 rounded-full text-[10px] font-black uppercase">Inquiry</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setLang(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(TRANSLATIONS[lang][key]) el.innerText = TRANSLATIONS[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if(TRANSLATIONS[lang][key]) el.placeholder = TRANSLATIONS[lang][key];
            });
        }

        document.getElementById('langSelector').addEventListener('change', (e) => setLang(e.target.value));
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000);

        renderProducts();
        setLang('en');
    </script>
</body>
</html>
