        .nav-wrap { display: flex; align-items: center; gap: 8px; }

        .btn-v:hover { background: var(--charcoal); transform: translateY(-1px); }

        /* DROPDOWN */
        .dropdown { position: relative; display: inline-block; }
        .drop-content { display: none; position: absolute; background: white; min-width: 180px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 4px; top: 100%; left: 0; overflow: hidden; }
        .dropdown:hover .drop-content { display: block; }
        .drop-content button { width: 100%; padding: 14px; border: none; background: none; text-align: left; cursor: pointer; font-weight: 700; font-size: 0.7rem; border-bottom: 1px solid #f1f5f9; color: var(--navy); }

        /* VIEWS */
        .view { display: none; padding: calc(var(--header-h) + 40px) 5%; min-height: 100vh; }
        .view.active { display: block; }

        /* HOME HERO */
        .hero { height: 75vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(rgba(10,15,29,0.7), rgba(10,15,29,0.7)), url('IMAGES/ui/hero-bg.jpg') center/cover no-repeat; color: white; text-align: center; border-radius: 0 0 40px 40px; }
