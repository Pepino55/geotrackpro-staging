<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackPro | Vanguard Sovereign</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap:20px;">
        <img src="IMAGES/ui/logo.png" class="nav-logo" onclick="nav('home')" onerror="this.src='https://via.placeholder.com/150x40?text=GeoTrackPro'">
        <button onclick="nav('home')" class="btn-v" id="nav-h">Home</button>
        <button onclick="nav('prod-menu')" class="btn-v" id="nav-p">Products</button>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
        <button onclick="nav('contact')" class="btn-v" id="nav-c" style="background:#1e293b;">Contact</button>
        <select id="langSelect" onchange="updateLang(this.value)" style="width: auto; padding: 8px 15px; background: var(--accent); color: white; border-radius: 20px; font-weight: 800; border: none;">
            <option value="en">EN</option>
            <option value="it">IT</option>
            <option value="fr">FR</option>
            <option value="es">ES</option>
        </select>
    </div>
</header>

<div id="home" class="view active">
    <div style="text-align:center; padding-top:100px;">
        <h1 id="h-title" style="font-size: 3.5rem; font-weight: 800; margin:0;">VANGUARD GLOBAL</h1>
        <p id="h-sub" style="color: #64748b; font-size: 1.2rem; margin: 20px 0 40px;">Strategic Asset Intelligence & Telemetry</p>
        <button onclick="nav('prod-menu')" class="btn-v" id="h-btn" style="padding:18px 50px; font-size: 1.1rem;">EXPLORE CATALOG</button>
    </div>
</div>

<div id="prod-menu" class="view">
    <h2 id="cat-title" style="text-align:center; font-size: 2.2rem;">Product Categories</h2>
    <div class="cat-grid" id="cat-anchor"></div>
</div>

<div id="list-view" class="view">
    <button onclick="nav('prod-menu')" class="btn-v" style="background:#64748b; margin-bottom:30px;">← BACK</button>
    <div class="product-grid" id="gridAnchor"></div>
</div>

<div id="contact" class="view">
    <div class="contact-container">
        <div class="contact-form-side" id="form-side">
            <form id="vanguardForm">
                <input type="hidden" name="access_key" value="8c8df878-746f-4fd6-9847-7c1edff3622c">
                <h2 id="f-title" style="margin-top:0;">CONTACT US</h2>
                <input type="text" name="name" placeholder="Full Name *" required>
                <input type="email" name="email" placeholder="Email *" required>
                <select name="country" id="in-country" required></select>
                <textarea name="message" rows="5" placeholder="Message *" required></textarea>
                <button type="submit" id="btn-submit" class="btn-v" style="width:100%; height:60px;">SEND INQUIRY</button>
            </form>
        </div>
        <div class="success-side" id="success-side">
            <div style="font-size: 70px; margin-bottom: 20px;">✅</div>
            <h2 id="s-title">Message Sent</h2>
            <p id="s-text" style="color: #64748b;">A specialist will contact you shortly.</p>
            <button onclick="resetForm()" class="btn-v" style="background:#64748b;">SEND ANOTHER</button>
        </div>
        <div style="background:#eee; position:relative;">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.8354345093643!2d144.9537353153166!3d-37.81627977975171!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0xf577d2230d5700!2sMelbourne!5e0!3m2!1sen!2sau!4v1617181654321!5m2!1sen!2sau" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>
</div>

<footer>
    <div>© 2026 GEOTRACKPRO | <span id="clock"></span> <span class="status-led"></span></div>
    <div style="display:flex; gap:30px;">
       <a href="DOCS/LEGAL/terms.pdf" target="_blank" style="color:white; text-decoration:none; font-weight:800;">TERMS</a>
       <a href="DOCS/LEGAL/privacy.pdf" target="_blank" style="color:white; text-decoration:none; font-weight:800;">PRIVACY</a>
    </div>
</footer>

<script>
    const WAREHOUSE = [
        { id: "vl103", cat: ["vehicle"], name: "VL103", desc: "4G Multimodal LTE Tracker with GNSS." },
        { id: "jc400", cat: ["dashcam"], name: "JC400", desc: "Edge AI Dual-Channel Dashcam." },
        { id: "ll301", cat: ["asset"], name: "LL301", desc: "Asset GNSS Tracker (10,000mAh)." }
    ];

    const TXT = {
        en: { h: "VANGUARD GLOBAL", home: "Home", prod: "Products", cont: "Contact", cat: "Product Categories", s_msg: "Message Sent", s_btn: "SEND ANOTHER" },
        it: { h: "VANGUARDIA GLOBALE", home: "Home", prod: "Prodotti", cont: "Contatti", cat: "Categorie Prodotti", s_msg: "Messaggio Inviato", s_btn: "INVIA ALTRO" },
        fr: { h: "VANGUARD MONDIAL", home: "Accueil", prod: "Produits", cont: "Contact", cat: "Catégories", s_msg: "Message Envoyé", s_btn: "ENVOYER UN AUTRE" },
        es: { h: "VANGUARDIA GLOBAL", home: "Inicio", prod: "Productos", cont: "Contacto", cat: "Categorías", s_msg: "Mensaje Enviado", s_btn: "ENVIAR OTRO" }
    };

    function init() {
        updateLang('en');
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000);
        document.getElementById('vanguardForm').addEventListener('submit', handleSubmission);
    }

    function updateLang(l) {
        const t = TXT[l];
        document.getElementById('nav-h').innerText = t.home;
        document.getElementById('nav-p').innerText = t.prod;
        document.getElementById('nav-c').innerText = t.cont;
        document.getElementById('h-title').innerText = t.h;
        document.getElementById('cat-title').innerText = t.cat;
        document.getElementById('s-title').innerText = t.s_msg;
        
        const countries = ["Italy", "France", "Spain", "UK", "USA", "Other"];
        document.getElementById('in-country').innerHTML = '<option value="">Select Country *</option>' + 
            countries.map(c => `<option value="${c}">${c}</option>`).join('');
        
        renderCats();
    }

    function renderCats() {
        const cats = [{id:'vehicle',n:'Vehicle',i:'🚗'}, {id:'asset',n:'Asset',i:'📦'}, {id:'dashcam',n:'Dashcam',i:'📹'}];
        document.getElementById('cat-anchor').innerHTML = cats.map(c => 
            `<div class="cat-card" onclick="renderList('${c.id}')"><span>${c.i}</span><strong>${c.n}</strong></div>`).join('');
    }

    function renderList(cat) {
        nav('list-view');
        const items = WAREHOUSE.filter(d => d.cat.includes(cat));
        document.getElementById('gridAnchor').innerHTML = items.map(d => `
            <div class="card">
                <div class="card-img"><img src="IMAGES/${cat}/${d.id}.png" onerror="this.src='IMAGES/ui/coming-soon.png';"></div>
                <div class="card-info">
                    <div><h4>${d.name}</h4><p>${d.desc}</p></div>
                    <div style="display:flex; gap:10px;">
                        <a href="DOCS/SPECS/${d.id}.pdf" target="_blank" class="btn-v btn-outline" style="flex:1;">SPECS</a>
                        <button onclick="openForm('${d.name}')" class="btn-v" style="flex:1;">INQUIRY</button>
                    </div>
                </div>
            </div>`).join('');
    }

    function nav(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }

    function openForm(t) {
        document.getElementById('f-title').innerText = t;
        nav('contact');
    }

    async function handleSubmission(e) {
        e.preventDefault();
        const res = await fetch('https://api.web3forms.com/submit', { method: 'POST', body: new FormData(e.target) });
        if (res.ok) {
            document.getElementById('form-side').style.display = 'none';
            document.getElementById('success-side').style.display = 'block';
        }
    }

    function resetForm() {
        document.getElementById('vanguardForm').reset();
        document.getElementById('form-side').style.display = 'block';
        document.getElementById('success-side').style.display = 'none';
        nav('home');
    }

    window.onload = init;
</script>
</body>
</html>
