    function renderCats() {
        const l = document.getElementById('langSelect').value;
        const t = TXT[l] || TXT.en;
        const cats = [{id:'vehicle',n:t.v,i:'🚗'},{id:'asset',n:t.a,i:'📦'},{id:'dashcam',n:t.dc,i:'📹'},{id:'obd',n:t.o,i:'🔌'},{id:'personal',n:t.s,i:'👤'},{id:'tags',n:t.tg,i:'🏷️'},{id:'acc',n:t.ac,i:'⚙️'},{id:'motorcycle',n:t.m,i:'🏍️'}];

    function renderList(cat) {
        nav('list-view');
        const items = cat === 'all' ? WAREHOUSE : WAREHOUSE.filter(d => d.cat.includes(cat));
        document.getElementById('gridAnchor').innerHTML = items.map(d => {
            const count = d.imgCount || 1;
            let imgs = '', pips = '';
            for(let i=1; i<=count; i++){
                const src = `IMAGES/${d.cat[0].toLowerCase()}/${d.id.toLowerCase().split('_')[0]}${count>1?'_0'+i:''}.png`;
                imgs += `<img src="${src}" class="img-stack img-${d.id} ${i===1?'active':''}" onerror="this.src='IMAGES/ui/coming-soon.png'">`;
                if(count > 1) pips += `<div class="pip pip-${d.id} ${i===1?'active':''}"></div>`;
            }
            return `<div class="card" onmouseenter="startC('${d.id}', ${count})" onmouseleave="stopC('${d.id}')">
                <div class="card-img" onclick="window.open(document.querySelector('.img-${d.id}.active').src, '_blank')">${imgs}<div class="pips">${pips}</div></div>

                </div>
            </div>`;
        }).join('');
    }

    function startC(id, count) { if(count < 2) return; carousels[id] = setInterval(() => { let imgs = document.querySelectorAll(`.img-${id}`), pips = document.querySelectorAll(`.pip-${id}`), cur = Array.from(imgs).findIndex(i=>i.classList.contains('active')); imgs[cur].classList.remove('active'); pips[cur].classList.remove('active'); let nxt = (cur+1)%count; imgs[nxt].classList.add('active'); pips[nxt].classList.add('active'); }, 2000); }
    function stopC(id) { clearInterval(carousels[id]); }

        nav('contact');
    }

    function syncMap(loc) { document.getElementById('loc-map').src = `https://www.google.com/maps/embed/v1/place?key=AIzaSyA...&q=${encodeURIComponent(loc)}`; }

    function updateLang(l) {
        const t = TXT[l] || TXT.en;
        document.querySelectorAll('[data-i18n]').forEach(el => { let key = el.getAttribute('data-i18n'); if(t[key]) el.innerText = t[key]; });
        document.getElementById('in-name').placeholder = t.fName; document.getElementById('in-comp').placeholder = t.fComp;
        document.getElementById('in-email').placeholder = t.fEmail; document.getElementById('in-tel').placeholder = t.fTel;
        document.getElementById('in-msg').placeholder = t.fMsg; document.getElementById('opt-country').innerText = t.country;
        renderCats();
    }

    async function auto() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const d = await res.json();
            if(d.country_name) {
                document.getElementById('in-country').value = d.country_name; syncMap(d.country_name);
                const l = {'IT':'it','FR':'fr','ES':'es'}[d.country_code] || 'en';
                document.getElementById('langSelect').value = l; updateLang(l);
            }
        } catch(e) { updateLang('en'); }
    }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000);
    window.onload = auto;
</script>
</body>
</html>
