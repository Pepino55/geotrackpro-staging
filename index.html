            submit: "ENVOYER", country: "Choisir Pays *", c1: "CONTACTEZ-NOUS", btn_contact: "Contact", btn_demo: "Demande Démo", legal_terms: "CONDITIONS", legal_privacy: "CONFIDENTIALITÉ"
        }
    };

    let carouselIntervals = {};

    function nav(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        const t = document.getElementById(id); if(t) t.classList.add('active');
        if(id === 'prod-menu') renderCats();
        window.scrollTo(0,0);
    }

    function updateLang(lang) {
        const bundle = DICTIONARY[lang] || DICTIONARY.en;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if(bundle[key]) el.innerText = bundle[key];
        });
        document.querySelectorAll('[data-i18n-ph]').forEach(el => {
            const key = el.getAttribute('data-i18n-ph');
            if(bundle[key]) el.placeholder = bundle[key];
        });
        if(document.getElementById('prod-menu').classList.contains('active')) renderCats();
    }

    function renderCats() {
        const lang = document.getElementById('langSelect').value;
        const b = DICTIONARY[lang] || DICTIONARY.en;
        const cats = [
            {id:'vehicle',n:b.cat_v,i:'🚗'}, {id:'asset',n:b.cat_a,i:'📦'}, {id:'dashcam',n:b.cat_dc,i:'📹'}, 
            {id:'obd',n:b.cat_o,i:'🔌'}, {id:'personal',n:b.cat_s,i:'👤'}, {id:'tags',n:b.cat_tg,i:'🏷️'}, 
            {id:'acc',n:b.cat_ac,i:'⚙️'}, { id: 'motorcycle', n: b.cat_m, i: '🏍️' }
        ];
        document.getElementById('cat-anchor').innerHTML = cats.map(c => `
            <div style="background:white; padding:30px; border-radius:20px; text-align:center; border:1px solid #eee; cursor:pointer;" onclick="renderList('${c.id}')">
                <span style="font-size:2rem;">${c.i}</span>
                <h3>${c.n}</h3>
            </div>`).join('');
    }

    function renderList(cat) {
        nav('list-view');
        const items = cat === 'all' ? WAREHOUSE : WAREHOUSE.filter(d => d.cat.includes(cat));
        document.getElementById('gridAnchor').innerHTML = items.map(d => {
            const tags = d.features.map(f => `<div class="f-tag"><span class="f-icon">${f.icon}</span> ${f.label}</div>`).join('');
            let imgHTML = ''; let pipHTML = '';
            const count = d.imgCount || 1;
            for(let i=1; i<=count; i++){
                const suffix = d.imgCount > 1 ? `_${String(i).padStart(2, '0')}` : '';
                const activeClass = i === 1 ? 'active' : '';
                imgHTML += `<img src="IMAGES/${d.cat[0]}/${d.id.toLowerCase().split('_')[0]}${suffix}.png" class="img-stack img-${d.id} ${activeClass}" onerror="this.src='IMAGES/ui/coming-soon.png'">`;
                if(count > 1) pipHTML += `<div class="pip pip-${d.id} ${activeClass}"></div>`;
            }

            return `
            <div class="card" onmouseenter="stopCarousel('${d.id}')" onmouseleave="startCarousel('${d.id}', ${count})">
                <div class="card-img" onclick="window.open('IMAGES/${d.cat[0]}/${d.id.toLowerCase().split('_')[0]}_01.png', '_blank')">
                    ${imgHTML}
                    <div class="pips">${pipHTML}</div>
                </div>
                <div class="card-info">
                    <div><h4 style="margin:0; font-weight:800;">${d.name}</h4><div class="f-grid">${tags}</div><p style="font-size:0.75rem; color:#64748b;">${d.desc}</p></div>
                    <div style="display:flex; gap:10px; margin-top:auto;">
                        <a href="DOCS/SPECS/${d.id.toLowerCase().split('_')[0]}.pdf" target="_blank" class="btn-v" style="flex:1; background:#64748b;">SPECS</a>
                        <button onclick="openForm('${d.id}')" class="btn-v" style="flex:1;">INQUIRY</button>
                    </div>
                </div>
            </div>`;
        }).join('');
        items.forEach(d => { if(d.imgCount > 1) startCarousel(d.id, d.imgCount); });
    }

    function startCarousel(id, count) {
        if(carouselIntervals[id]) clearInterval(carouselIntervals[id]);
        carouselIntervals[id] = setInterval(() => {
            const imgs = document.querySelectorAll(`.img-${id}`);
            const pips = document.querySelectorAll(`.pip-${id}`);
            let current = Array.from(imgs).findIndex(img => img.classList.contains('active'));
            if(current === -1) return;
            imgs[current].classList.remove('active');
            if(pips[current]) pips[current].classList.remove('active');
            let next = (current + 1) % count;
            imgs[next].classList.add('active');
            if(pips[next]) pips[next].classList.add('active');
        }, 3000);
    }

    function stopCarousel(id) { clearInterval(carouselIntervals[id]); }

    function openForm(subject) {
        document.getElementById('f-title').innerText = subject;
        nav('contact');
    }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000);
    window.onload = () => { updateLang('en'); };
</script>
</body>
</html>
