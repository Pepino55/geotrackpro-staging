<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackPro | Enterprise v22.6.4</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #e8ddc7; --navy: #0a0f1d; --accent: #1d72f3; --round: 18px; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { margin: 0; background: #fcfcfc; padding-bottom: 60px; }

        /* HEADER RECONSTRUCTION */
        header { background: var(--gold); height: 85px; position: fixed; top: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 2%; z-index: 10000; }
        .logo { height: 45px; cursor: pointer; }
        .nav-group { display: flex; gap: 8px; align-items: center; }
        
        .btn-v { background: var(--navy); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 800; font-size: 0.7rem; cursor: pointer; text-transform: uppercase; }
        .btn-platform { background: #10b981; }
        .btn-v:hover { background: var(--accent); }

        /* DROPDOWN */
        .dropdown { position: relative; }
        .drop-content { display: none; position: absolute; background: white; min-width: 220px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); border-radius: 12px; top: 100%; left: 0; overflow: hidden; padding: 8px 0; }
        .dropdown:hover .drop-content { display: block; }
        .drop-content button { width: 100%; padding: 12px 20px; border: none; background: none; text-align: left; cursor: pointer; font-weight: 700; color: var(--navy); font-size: 0.85rem; border-bottom: 1px solid #f1f5f9; }

        /* VIEWS */
        .view { display: none; padding: 120px 5% 60px; min-height: 100vh; }
        .view.active { display: block; }

        /* CATEGORY SELECTOR (IMAGE 28CD22) */
        .cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 40px; }
        .cat-box { background: white; border: 1px solid #e2e8f0; padding: 30px; border-radius: 15px; text-align: center; cursor: pointer; }
        .cat-box:hover { border-color: var(--accent); box-shadow: 0 10px 20px rgba(29,114,243,0.1); }
        .cat-box img { width: 40px; margin-bottom: 10px; }

        /* DEVICE CARDS (IMAGE 28BB15) */
        .device-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 25px; }
        .device-card { background: white; border-radius: var(--round); border: 1px solid #eee; display: flex; padding: 25px; gap: 20px; align-items: center; }
        .device-card img { width: 140px; height: 140px; object-fit: contain; background: #f8fafc; border-radius: 12px; }
        .device-info h3 { margin: 0 0 10px; font-size: 1.4rem; }
        .btn-specs { background: #64748b; color: white; border: none; padding: 10px 25px; border-radius: 20px; cursor: pointer; margin-right: 10px; font-weight: 800; }
        .btn-inquiry { background: var(--accent); color: white; border: none; padding: 10px 25px; border-radius: 20px; cursor: pointer; font-weight: 800; }

        /* CONTACT RECONSTRUCTION (IMAGE 28BE99) */
        .contact-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; background: white; border-radius: 25px; padding: 40px; border: 1px solid #eee; }
        .map-box { border-radius: 20px; overflow: hidden; height: 100%; min-height: 450px; }
        input, select, textarea { width: 100%; padding: 16px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 12px; background: #fcfcfc; }

        footer { background: var(--navy); color: white; height: 65px; position: fixed; bottom: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 4%; font-size: 0.75rem; }
    </style>
</head>
<body>

<header>
    <div class="nav-group">
        <img src="IMAGES/ui/logo.png" class="logo" onclick="nav('home')" alt="GeoTrackPro">
        <div class="dropdown">
            <button class="btn-v" id="nav-company">COMPANY ▾</button>
            <div class="drop-content">
                <button onclick="nav('about-us')" id="drop-about">CHI SIAMO</button>
                <button onclick="nav('partners')" id="drop-partners">PARTNER</button>
            </div>
        </div>
        <button onclick="nav('home')" class="btn-v" id="nav-home">HOME</button>
    </div>
    <div class="nav-group">
        <div class="dropdown">
            <button class="btn-v" id="nav-prod" style="background:var(--accent);">PRODUCTS ▾</button>
            <div class="drop-content">
                <button onclick="showCategories()" id="drop-view-all">VIEW ALL</button>
                <button onclick="renderList('vehicle')" id="drop-vehicle">VEHICLE</button>
                <button onclick="renderList('asset')" id="drop-asset">ASSET</button>
                <button onclick="renderList('dashcam')" id="drop-dashcam">DASHCAM</button>
                <button onclick="renderList('obd')" id="drop-obd">OBD</button>
                <button onclick="renderList('personal')" id="drop-personal">PERSONAL</button>
                <button onclick="renderList('tags')" id="drop-tags">TAGS</button>
            </div>
        </div>
        <button onclick="showCategories()" class="btn-v" id="nav-catalog">CATALOG</button>
        <button onclick="openForm('SALES QUERY')" class="btn-v" id="nav-sales">SALES QUERY</button>
        <button onclick="openForm('DEMO REQUEST')" class="btn-v" id="nav-demo">DEMO</button>
        <button onclick="window.open('https://tracksolidpro.com')" class="btn-v btn-platform">PLATFORM</button>
        <select id="langSelect" onchange="updateLang(this.value)">
            <option value="it">IT</option><option value="en">EN</option>
        </select>
    </div>
</header>

<div id="home" class="view active">
    </div>

<div id="cat-selector" class="view">
    <h1 id="cat-main-title">HARDWARE CATEGORIES</h1>
    <div class="cat-grid">
        <div class="cat-box" onclick="renderList('vehicle')"><img src="IMAGES/icons/car.png"><h4>Vehicle</h4></div>
        <div class="cat-box" onclick="renderList('asset')"><img src="IMAGES/icons/box.png"><h4>Asset</h4></div>
        <div class="cat-box" onclick="renderList('dashcam')"><img src="IMAGES/icons/cam.png"><h4>Dashcam</h4></div>
        <div class="cat-box" onclick="renderList('obd')"><img src="IMAGES/icons/plug.png"><h4>OBD</h4></div>
    </div>
</div>

<div id="list-view" class="view">
    <button onclick="showCategories()" class="btn-v" style="margin-bottom:20px;">← BACK</button>
    <div class="device-grid" id="gridAnchor"></div>
</div>

<div id="partners" class="view">
    <h1 id="part-title">GLOBAL PARTNERS</h1>
    <div class="contact-wrap" style="grid-template-columns: 1fr 1fr;">
        <div class="cat-box"><h3 id="part-t1">Technology Tier</h3><p id="part-p1">Integrating with leading GNSS and LTE chipset providers.</p></div>
        <div class="cat-box"><h3 id="part-t2">Regional Logistics</h3><p id="part-p2">Strategic warehousing and local technical support.</p></div>
    </div>
</div>

<div id="contact" class="view">
    <div class="contact-wrap">
        <div>
            <h2 id="f-title">CONTACT US</h2>
            <form action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="8c8df878-746f-4fd6-9847-7c1edff3622c">
                <input type="text" name="name" id="in-name" placeholder="Full Name *" required>
                <input type="text" name="company" id="in-comp" placeholder="Company *" required>
                <input type="email" name="email" id="in-email" placeholder="Email *" required>
                <input type="tel" name="phone" id="in-tel" placeholder="Phone *">
                <select name="country"><option>Select Country *</option></select>
                <textarea name="message" id="in-msg" rows="5" placeholder="Message *"></textarea>
                <button type="submit" class="btn-v" id="btn-submit" style="width:100%; height:60px; background:var(--accent); border-radius:30px;">SEND INQUIRY</button>
            </form>
        </div>
        <div class="map-box">
             <iframe src="https://www.google.com/maps/embed?..." width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>
</div>

<footer>
    <div>© 2026 GEOTRACKPRO | <span id="clock"></span> <span style="color:#00ff00; margin:0 10px;">●</span> v22.6.4</div>
    <div>
        <a href="DOCS/LEGAL/terms.pdf" style="color:white; margin-right:15px;">TERMS</a>
        <a href="DOCS/LEGAL/privacy.pdf" style="color:white;">PRIVACY</a>
    </div>
</footer>

<script>
    const WAREHOUSE = [
        { id: "VL103", cat: "vehicle", name: "VL103", img: "IMAGES/devices/vl103.png", desc: "Hardwired vehicle tracker.", specs: ["4G", "Power"] },
        { id: "VL106", cat: "vehicle", name: "VL106", img: "IMAGES/devices/vl106.png", desc: "LTE vehicle tracker.", specs: ["GNSS"] }
    ];

    const TXT = {
        it: { 
            comp: "AZIENDA ▾", about: "CHI SIAMO", partners: "PARTNER", home: "HOME", prod: "PRODOTTI ▾", catalog: "CATALOGO", sales: "RICHIESTA VENDITE", demo: "RICHIESTA DEMO",
            fName: "Nome Completo *", fComp: "Azienda *", fEmail: "Email *", fTel: "Telefono *", fMsg: "Messaggio *", fBtn: "INVIA RICHIESTA",
            partT: "PARTNER GLOBALI", pt1: "Livello Tecnologico", pp1: "Integrazione con i principali fornitori di chipset GNSS e LTE.", pt2: "Logistica Regionale", pp2: "Magazzinaggio strategico e supporto tecnico locale."
        },
        en: { 
            comp: "COMPANY ▾", about: "ABOUT US", partners: "PARTNERS", home: "HOME", prod: "PRODUCTS ▾", catalog: "CATALOGO", sales: "SALES QUERY", demo: "DEMO REQUEST",
            fName: "Full Name *", fComp: "Company *", fEmail: "Email *", fTel: "Phone *", fMsg: "Message *", fBtn: "SEND INQUIRY",
            partT: "GLOBAL PARTNERS", pt1: "Technology Tier", pp1: "Integrating with leading GNSS and LTE chipset providers.", pt2: "Regional Logistics", pp2: "Strategic warehousing and local technical support."
        }
    };

    function updateLang(l) {
        const t = TXT[l];
        document.getElementById('nav-company').innerText = t.comp;
        document.getElementById('drop-about').innerText = t.about;
        document.getElementById('drop-partners').innerText = t.partners;
        document.getElementById('nav-home').innerText = t.home;
        document.getElementById('nav-prod').innerText = t.prod;
        document.getElementById('nav-catalog').innerText = t.catalog;
        document.getElementById('nav-sales').innerText = t.sales;
        document.getElementById('nav-demo').innerText = t.demo;
        document.getElementById('in-name').placeholder = t.fName;
        document.getElementById('in-comp').placeholder = t.fComp;
        document.getElementById('in-email').placeholder = t.fEmail;
        document.getElementById('in-tel').placeholder = t.fTel;
        document.getElementById('in-msg').placeholder = t.fMsg;
        document.getElementById('btn-submit').innerText = t.fBtn;
        document.getElementById('part-title').innerText = t.partT;
        document.getElementById('part-t1').innerText = t.pt1; document.getElementById('part-p1').innerText = t.pp1;
        document.getElementById('part-t2').innerText = t.pt2; document.getElementById('part-p2').innerText = t.pp2;
    }

    function nav(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function showCategories() { nav('cat-selector'); }

    function renderList(cat) {
        nav('list-view');
        const items = WAREHOUSE.filter(i => i.cat === cat);
        document.getElementById('gridAnchor').innerHTML = items.map(i => `
            <div class="device-card">
                <img src="${i.img}">
                <div class="device-info">
                    <h3>${i.name}</h3>
                    <p>${i.desc}</p>
                    <button class="btn-specs" onclick="openSpecs('${i.id}')">SPECS</button>
                    <button class="btn-inquiry" onclick="openForm('INQUIRY: ${i.name}')">INQUIRY</button>
                </div>
            </div>
        `).join('');
    }

    function openForm(type) { document.getElementById('f-title').innerText = type; nav('contact'); }
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000);
    window.onload = () => { updateLang('it'); };
</script>
</body>
</html>
