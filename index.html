<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackPro | Vanguard v27.5</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <div class="nav-group">
        <img src="IMAGES/ui/logo.png" height="35" onclick="nav('home')" style="cursor:pointer">
        <button onclick="nav('about')" class="btn-v" style="background:#475569">ABOUT US</button>
        <button onclick="nav('home')" class="btn-v btn-navy">HOME</button>
    </div>
    <div class="nav-group">
        <button onclick="nav('prod-menu')" class="btn-v btn-blue">PRODUCTS</button>
        <button onclick="nav('contact')" class="btn-v btn-blue">CONTACT</button>
        <button onclick="nav('contact')" class="btn-v btn-purple">DEMO REQUEST</button>
        <button onclick="window.open('https://tracksolidpro.com')" class="btn-v btn-green">PLATFORM</button>
        <select style="background:var(--blue); color:white; border:none; border-radius:20px; padding:5px 10px; font-weight:800; font-size:0.6rem;">
            <option>EN</option>
            <option>IT</option>
        </select>
    </div>
</header>

<div id="home" class="view active" style="padding:0;">
    <div class="hero">
        <h1>VANGUARD GLOBAL</h1>
        <div style="display:flex; gap:15px; margin-top:30px;">
            <button onclick="nav('prod-menu')" class="btn-v btn-blue">EXPLORE CATALOG</button>
            <button onclick="nav('contact')" class="btn-v" style="background:white; color:#0f172a!important;">SALES CONSULTATION</button>
        </div>
    </div>
</div>

<div id="about" class="view" style="padding: 120px 7%;">
    <h1>THE VANGUARD STANDARD</h1>
    <p>Global Asset Intelligence for the Modern Enterprise.</p>
</div>

<footer>
    <div>© 2026 GEOTRACKPRO | <span id="clock"></span> <span class="status-led"></span></div>
    <div class="footer-links">
        <a href="DOCS/TERMS.pdf" target="_blank">TERMS</a>
        <a href="DOCS/PRIVACY.pdf" target="_blank">PRIVACY</a>
    </div>
</footer>

<script>
    function nav(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000);
</script>
</body>
</html>
