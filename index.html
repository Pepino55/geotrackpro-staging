<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackPro | Vanguard Enterprise v24.0</title>
    <script src="https://cdn.jsdelivr.net/npm/contentful@latest/dist/contentful.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #e8ddc7; --accent: #3E63DD; --navy: #0a0f1d; --header-h: 80px; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { margin: 0; background: #f8fafc; color: var(--navy); padding-bottom: 80px; }
        
        header { background: var(--gold); height: var(--header-h); position: fixed; top: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 3%; z-index: 9999; box-shadow: 0 2px 15px rgba(0,0,0,0.1); }
        .nav-group { display: flex; align-items: center; gap: 10px; }
        
        .btn-v { background: var(--accent); color: white!important; padding: 10px 18px; border-radius: 50px; font-weight: 800; font-size: 0.65rem; border: none; cursor: pointer; text-transform: uppercase; text-decoration: none; transition: 0.2s; white-space: nowrap; }
        .btn-v:hover { filter: brightness(1.1); transform: translateY(-1px); }

        .view { display: none; padding: calc(var(--header-h) + 40px) 5%; min-height: 100vh; }
        .view.active { display: block; }
        
        /* FIXING THE "STRANGE" LAYOUT */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 25px; margin-top: 30px; }
        .card { background: white; border-radius: 24px; border: 1px solid #e2e8f0; padding: 25px; display: flex; gap: 20px; height: 260px; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .card-img { flex: 0 0 140px; height: 100%; display: flex; align-items: center; justify-content: center; background: #fcfcfc; border-radius: 15px; border: 1px solid #f1f5f9; padding: 10px; }
        .card-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .card-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; height: 100%; }

        /* LEGAL & FOOTER */
        footer { background: var(--navy); color: white; height: 60px; position: fixed; bottom: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 4%; font-size: 0.7rem; z-index: 10000; }
        .footer-links { display: flex; gap: 20px; }
        .footer-links a { color: #94a3b8; text-decoration: none; cursor: pointer; font-weight: 600; text-transform: uppercase; }
        .footer-links a:hover { color: white; }
        
        .status-led { height: 8px; width: 8px; background: #00FF00; border-radius: 50%; display: inline-block; margin-left: 8px; box-shadow: 0 0 10px #00FF00; }
    </style>
</head>
<body>

<header>
    <div class="nav-group">
        <img src="IMAGES/ui/logo.png" height="32" onclick="nav('home')" style="cursor:pointer" alt="Logo">
        <button onclick="nav('about')" class="btn-v" style="background:#475569;">ABOUT US</button>
        <button onclick="nav('home')" class="btn-v" style="background:#1e293b;">HOME</button>
    </div>
    <div class="nav-group">
        <button onclick="nav('prod-menu')" class="btn-v">PRODUCTS</button>
        <button onclick="openForm('DEMO REQUEST')" class="btn-v" style="background:#6366f1;">DEMO REQUEST</button>
        <button onclick="window.open('https://tracksolidpro.com')" class="btn-v" style="background:#059669;">PLATFORM</button>
    </div>
    <select id="langSelect" onchange="translateUI()" style="border-radius:20px; font-weight:800; font-size:0.65rem; padding: 8px 15px; background: var(--accent); color: white; border: none; cursor:pointer;">
        <option value="en">ENGLISH</option>
        <option value="it">ITALIANO</option>
    </select>
</header>

<div id="home" class="view active" style="padding:0; background: linear-gradient(rgba(10,15,29,0.7), rgba(10,15,29,0.7)), url('IMAGES/ui/hero-bg.jpg') center/cover;">
    <div style="height:85vh; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; text-align:center;">
        <h1 style="font-size: 4.5rem; margin:0; font-weight:800;">VANGUARD GLOBAL</h1>
        <button onclick="nav('prod-menu')" class="btn-v" style="padding:20px 60px; margin-top:30px; font-size:1rem;">ENTER SHOWROOM</button>
    </div>
</div>

<div id="about" class="view">
    <div style="max-width:800px; margin: 0 auto;">
        <h2 style="font-size: 2.5rem; color: var(--accent);">About Vanguard</h2>
        <p>Vanguard Enterprise delivers military-grade tracking precision for global logistics and asset security.</p>
    </div>
</div>

<div id="prod-menu" class="view">
    <div id="cat-anchor" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:20px;"></div>
</div>

<div id="list-view" class="view">
    <button onclick="nav('prod-menu')" class="btn-v" style="background:#64748b; margin-bottom:25px;">← BACK TO CATEGORIES</button>
    <div class="product-grid" id="gridAnchor"></div>
</div>

<div id="contact" class="view">
    <div style="background:white; padding:40px; border-radius:30px; border:1px solid #e2e8f0; max-width:600px; margin: 0 auto;">
        <form action="https://formspree.io/f/mwvnvzee" method="POST">
            <h2 id="f-title">INQUIRY</h2>
            <input type="text" name="name" placeholder="Full Name *" required style="width:100%; padding:12px; margin-bottom:12px; border-radius:10px; border:1px solid #ccc;">
            <input type="email" name="email" placeholder="Email *" required style="width:100%; padding:12px; margin-bottom:12px; border-radius:10px; border:1px solid #ccc;">
            <textarea name="message" rows="5" placeholder="Message *" required style="width:100%; padding:12px; margin-bottom:12px; border-radius:10px; border:1px solid #ccc;"></textarea>
            <button type="submit" class="btn-v" style="width:100%; height:50px;">SUBMIT</button>
        </form>
    </div>
</div>

<footer>
    <div>© 2026 GEOTRACKPRO | <span id="clock"></span> <span class="status-led"></span></div>
    <div class="footer-links">
        <a href="DOCS/TERMS.pdf" target="_blank">TERMS</a>
        <a href="DOCS/PRIVACY.pdf" target="_blank">PRIVACY</a>
    </div>
</footer>

<script>
    const client = contentful.createClient({ space: 'i5s6f0gd4tb8', accessToken: 'swHDtaIfiaaF3J7XXWlKy7Ta0qjNIgPrpUT9SI4VXeI' });
    let DB = [];

    async function sync() {
        const res = await client.getEntries({ content_type: 'device' });
        DB = res.items.map(i => ({
            id: i.fields.modelId || "N/A",
            cat: (i.fields.category || "").toLowerCase(),
            name: i.fields.name || "Device",
            img: i.fields.deviceImage?.fields?.file?.url ? 'https:' + i.fields.deviceImage.fields.file.url : 'IMAGES/ui/coming-soon.png',
            pdf: i.fields.specsPdf?.fields?.file?.url ? 'https:' + i.fields.specsPdf.fields.file.url : '#'
        }));
        renderCats();
    }

    function nav(id) { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
    function openForm(t) { document.getElementById('f-title').innerText = t; nav('contact'); }

    function renderCats() {
        const cats = [{id:'vehicle', n:'Vehicle', i:'🚗'}, {id:'asset', n:'Asset', i:'📦'}, {id:'dashcam', n:'Dashcam', i:'📹'}, {id:'obd', n:'OBD', i:'🔌'}];
        document.getElementById('cat-anchor').innerHTML = cats.map(c => `
            <div style="background:white; padding:35px; border-radius:24px; text-align:center; cursor:pointer; border:1px solid #e2e8f0;" onclick="renderList('${c.id}')">
                <span style="font-size:2.5rem; display:block; margin-bottom:10px;">${c.i}</span>
                <b>${c.n.toUpperCase()}</b>
            </div>`).join('');
    }

    function renderList(cat) {
        nav('list-view');
        const items = DB.filter(d => d.cat === cat);
        document.getElementById('gridAnchor').innerHTML = items.map(d => `
            <div class="card">
                <div class="card-img"><img src="${d.img}"></div>
                <div class="card-info">
                    <div><h3 style="margin:0;">${d.name}</h3><small>MODEL: ${d.id}</small></div>
                    <div style="display:flex; gap:10px;">
                        <a href="${d.pdf}" target="_blank" class="btn-v" style="flex:1; background:#64748b;">SPECS</a>
                        <button onclick="openForm('${d.id}')" class="btn-v" style="flex:1;">INQUIRY</button>
                    </div>
                </div>
            </div>`).join('');
    }

    window.onload = sync;
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000);
</script>
</body>
</html>
