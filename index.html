    let carouselIntervals = {};

    function nav(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        const t = document.getElementById(id); if(t) t.classList.add('active');
        if(id === 'prod-menu') renderCats();
        window.scrollTo(0,0);
    }

    function updateLang(l) {
        const t = TXT[l] || TXT.en;
        document.getElementById('h-title').innerText = t.h;
        document.getElementById('nav-prod').innerText = t.p + " ▾";
        document.getElementById('nav-company').innerText = t.navC;
        document.getElementById('drop-about').innerText = t.dropAb;
        document.getElementById('drop-partners').innerText = t.dropPt;
        document.getElementById('ab-title').innerText = t.abT;
        document.getElementById('ab-subtitle').innerText = t.abS;
        document.getElementById('ab-p1').innerText = t.abP1;
        document.getElementById('ab-m-title').innerText = t.abMT;
        document.getElementById('ab-m-p').innerText = t.abMP;
        document.getElementById('ab-g-title').innerText = t.abGT;
        document.getElementById('ab-g-p').innerText = t.abGP;
        document.getElementById('ab-s-title').innerText = t.abST;
        document.getElementById('ab-s-p').innerText = t.abSP;
        document.getElementById('pt-title').innerText = t.ptT;
        document.getElementById('pt-p1').innerText = t.ptP1;
        document.getElementById('in-name').placeholder = t.fName;
        document.getElementById('in-comp').placeholder = t.fComp;
        document.getElementById('in-email').placeholder = t.fEmail;
        document.getElementById('in-tel').placeholder = t.fTel;
        document.getElementById('in-msg').placeholder = t.fMsg;
        document.getElementById('opt-country').innerText = t.country;
        document.getElementById('btn-submit').innerText = t.submit;
        renderCats();
    }

    function renderCats() {
        const lang = document.getElementById('langSelect').value;
        const t = TXT[lang] || TXT.en;
        const cats = [{id:'vehicle',n:t.v,i:'🚗'}, {id:'asset',n:t.a,i:'📦'}, {id:'dashcam',n:t.dc,i:'📹'}, {id:'obd',n:t.o,i:'🔌'}, {id:'personal',n:t.s,i:'👤'}, {id:'tags',n:t.tg,i:'🏷️'}, {id:'acc',n:t.ac,i:'⚙️'}, { id: 'motorcycle', n: t.m, i: '🏍️' }];
        document.getElementById('cat-anchor').innerHTML = cats.map(c => `<div style="background:white; padding:30px; border-radius:20px; text-align:center; border:1px solid #eee; cursor:pointer;" onclick="renderList('${c.id}')"><span>${c.i}</span><h3>${c.n}</h3></div>`).join('');
    }

    function renderList(cat) {
        nav('list-view');
        const items = cat === 'all' ? WAREHOUSE : WAREHOUSE.filter(d => d.cat.includes(cat));
        document.getElementById('gridAnchor').innerHTML = items.map(d => {
            const tags = d.features.map(f => `<div class="f-tag"><span class="f-icon">${f.icon}</span> ${f.label}</div>`).join('');
            let imgHTML = ''; let pipHTML = '';
            const count = d.imgCount || 1;
            for(let i=1; i<=count; i++){
                const activeClass = i === 1 ? 'active' : '';
                imgHTML += `<img src="IMAGES/${d.cat[0]}/${d.id.toLowerCase()}_0${i}.png" class="img-stack img-${d.id} ${activeClass}" onerror="this.src='IMAGES/ui/coming-soon.png'">`;
                if(count > 1) pipHTML += `<div class="pip pip-${d.id} ${activeClass}"></div>`;
            }
            return `<div class="card">
                <div class="card-img">${imgHTML}<div class="pips">${pipHTML}</div></div>
                <div class="card-info">
                    <div><h4 style="margin:0; font-weight:800;">${d.name}</h4><div class="f-grid">${tags}</div><p style="font-size:0.75rem; color:#64748b;">${d.desc}</p></div>
                    <div style="display:flex; gap:10px; margin-top:auto;">
                        <a href="DOCS/SPECS/${d.id.toLowerCase()}.pdf" target="_blank" class="btn-v" style="flex:1; background:#64748b;">SPECS</a>
                        <button onclick="openForm('${d.id}')" class="btn-v" style="flex:1;">INQUIRY</button>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function openForm(sub) { document.getElementById('f-title').innerText = sub; nav('contact'); }
    function resetForm() { document.getElementById("form-content").style.display = "block"; document.getElementById("form-status").style.display = "none"; }
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000);
    window.onload = () => { updateLang('en'); };
</script>
