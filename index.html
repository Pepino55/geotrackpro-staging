<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackPro | Sovereign Build</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #3E63DD; --navy: #0a0f1d; --gold: #f8f1e5; --btn-h: 48px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* HEADER - ANCHORED */
        header { 
            background: var(--gold); height: 95px; display: flex; align-items: center; justify-content: space-between; 
            padding: 0 5%; position: fixed; top: 0; width: 100%; z-index: 10000; border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .nav-zone { display: flex; gap: 4px; }
        
        /* DROP-DOWN ANCHORING */
        .nav-item { position: relative; display: inline-block; }
        .nav-btn { 
            height: var(--btn-h); padding: 0 15px; background: #fff; color: var(--navy); border: 1px solid #ddd; 
            border-radius: 4px; font-weight: 800; font-size: 0.65rem; text-transform: uppercase; cursor: pointer;
        }
        .nav-btn:hover { border-color: var(--accent); }

        .drop-content { 
            display: none; position: absolute; top: 100%; left: 0; background: white; 
            min-width: 200px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); z-index: 10001; border: 1px solid #eee;
        }
        .nav-item:hover .drop-content { display: block; }
        .drop-content a { color: #333; padding: 12px 16px; text-decoration: none; display: block; font-size: 0.75rem; border-bottom: 1px solid #eee; }
        .drop-content a:hover { background: #f8f9fa; color: var(--accent); }

        /* VIEWS */
        main { flex: 1; margin-top: 110px; margin-bottom: 80px; }
        .view { display: none; padding: 0 10%; }
        .view.active { display: block; }

        /* FORM */
        .card { max-width: 700px; margin: 0 auto; background: #fdfdfd; padding: 40px; border: 1px solid #eee; border-radius: 8px; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }

        /* FOOTER */
        footer { 
            background: #fff; height: 60px; position: fixed; bottom: 0; width: 100%; 
            display: flex; align-items: center; justify-content: space-between; padding: 0 5%; border-top: 2px solid var(--accent);
        }
    </style>
</head>
<body>

<header>
    <img src="IMAGES/UI/logo.png" height="40" onclick="nav('home')" style="cursor:pointer">
    <div class="nav-zone">
        <button class="nav-btn" onclick="nav('home')" data-t="h_home">Home</button>
        <div class="nav-item">
            <button class="nav-btn" data-t="h_comp">Company</button>
            <div class="drop-content">
                <a href="#" onclick="nav('about')" data-t="h_about">About Us</a>
                <a href="#" onclick="nav('partners')" data-t="h_part">Partners</a>
            </div>
        </div>
        <div class="nav-item">
            <button class="nav-btn" data-t="h_prod">Products</button>
            <div class="drop-content">
                <a href="#">View All</a><a href="#">Vehicle</a><a href="#">Asset</a><a href="#">Motorcycle</a><a href="#">OBD</a><a href="#">TAG</a><a href="#">DashCam</a><a href="#">Accessories</a><a href="#">Personal</a>
            </div>
        </div>
        <button class="nav-btn" onclick="nav('contact')" data-t="h_cont">Contact</button>
        <button class="nav-btn" onclick="nav('demo')" data-t="h_demo">Demo Request</button>
        <button class="nav-btn" style="color:var(--accent)" onclick="window.open('https://www.tracksolidpro.com')">Platform</button>
        <div class="nav-item">
            <button class="nav-btn">🌐 <span id="cur-l">EN</span></button>
            <div class="drop-content" style="right:0; left:auto;">
                <a href="#" onclick="setL('en')">English</a><a href="#" onclick="setL('fr')">Français</a><a href="#" onclick="setL('es')">Español</a><a href="#" onclick="setL('it')">Italiano</a>
            </div>
        </div>
    </div>
</header>

<main>
    <div id="v-home" class="view active"><h1 data-t="slogan">Innovative Solutions, Built Your Way</h1></div>
    <div id="v-contact" class="view">
        <div class="card">
            <h2 data-t="con_title">Contact Us</h2>
            <form action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="8c8df878-746f-4fd6-9847-7c1edff3622c">
                <input type="text" name="name" placeholder="Full Name*" required>
                <input type="email" name="email" placeholder="Email*" required>
                <select name="country" required>
                    <option value="FR">France (+33)</option><option value="IT">Italy (+39)</option><option value="ES">Spain (+34)</option><option value="GB">UK (+44)</option><option value="US">USA (+1)</option>
                </select>
                <input type="text" name="phone" placeholder="Phone*" required>
                <textarea name="message" placeholder="Message*" style="height:100px;"></textarea>
                <button type="submit" class="nav-btn" style="width:100%; background:var(--accent); color:white;">Send</button>
            </form>
        </div>
    </div>
</main>

<footer>
    <div><a href="#" style="color:#999; text-decoration:none; font-size:0.6rem;">BKO LOGIN</a></div>
    <div>SYSTEM ALIVE | <span id="clock"></span></div>
    <div><a href="#" data-t="f_terms">Terms</a> | <a href="#" data-t="f_priv">Privacy</a></div>
</footer>

<script>
    const DICT = {
        en: { h_home: "Home", h_comp: "Company", h_cont: "Contact", h_demo: "Demo Request", slogan: "Innovative Solutions, Built Your Way", con_title: "Contact Us", f_terms: "Terms", f_priv: "Privacy" },
        it: { h_home: "Home", h_comp: "Azienda", h_cont: "Contatti", h_demo: "Richiesta Demo", slogan: "Soluzioni Innovative", con_title: "Contattaci", f_terms: "Termini", f_priv: "Privacy" }
    };
    function nav(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('v-' + id).classList.add('active');
    }
    function setL(l) {
        document.getElementById('cur-l').innerText = l.toUpperCase();
        document.querySelectorAll('[data-t]').forEach(el => {
            const key = el.getAttribute('data-t');
            if(DICT[l] && DICT[l][key]) el.innerText = DICT[l][key];
        });
    }
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000);
</script>
</body>
</html>
