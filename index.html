<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackPro | Vanguard Enterprise v22.6.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #e8ddc7; --navy: #0a0f1d; --charcoal: #1e293b; --accent: #3E63DD; --header-h: 75px; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.2s; }
        
        body { margin: 0; background: #f8fafc; color: var(--navy); padding-bottom: 60px; overflow-x: hidden; }

        header { 
            background: var(--gold); height: var(--header-h); position: fixed; top: 0; width: 100%; 
            display: flex; align-items: center; justify-content: space-between; padding: 0 2%; z-index: 9999; 
        }
        
        .nav-wrap { display: flex; align-items: center; gap: 8px; }
        
        /* UNIFIED MONOCHROME BUTTONS */
        .btn-v { 
            background: var(--navy); color: white!important; padding: 10px 16px; border-radius: 4px; 
            font-weight: 800; font-size: 0.65rem; border: none; cursor: pointer; text-transform: uppercase;
            white-space: nowrap;
        }
        .btn-v:hover { background: var(--charcoal); transform: translateY(-1px); }

        .dropdown { position: relative; display: inline-block; }
        .drop-content { 
            display: none; position: absolute; background: white; min-width: 170px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 4px; top: 100%; left: 0; overflow: hidden;
        }
        .dropdown:hover .drop-content { display: block; }
        .drop-content button { 
            width: 100%; padding: 14px; border: none; background: none; text-align: left; 
            cursor: pointer; font-weight: 700; font-size: 0.7rem; border-bottom: 1px solid #f1f5f9;
        }
        .drop-content button:hover { background: #f8fafc; color: var(--accent); }

        .view { display: none; padding: calc(var(--header-h) + 40px) 5%; min-height: 100vh; }
        .view.active { display: block; }

        /* HERO - RESTORED IMAGE LOGIC */
        .hero { 
            height: 75vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(rgba(10,15,29,0.7), rgba(10,15,29,0.7)), url('IMAGES/ui/hero-bg.jpg') center/cover no-repeat;
            color: white; text-align: center; border-radius: 0 0 40px 40px;
        }

        .section-card { background: white; padding: 40px; border-radius: 20px; border: 1px solid #e2e8f0; margin-top: 20px; }
        .pillar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 25px; }
        .pillar { padding: 30px; border-radius: 12px; background: #fdfdfd; border-left: 4px solid var(--accent); border: 1px solid #eee; }

        /* CONTACT & MAP */
        .contact-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 30px; max-width: 1200px; margin: 0 auto; background: white; border-radius: 24px; overflow: hidden; border: 1px solid #e2e8f0; }
        .form-area { padding: 40px; }
        input, textarea, select { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 6px; }

        footer { 
            background: var(--navy); color: white; height: 55px; position: fixed; bottom: 0; width: 100%; 
            display: flex; align-items: center; justify-content: space-between; padding: 0 4%; font-size: 0.65rem; z-index: 10000;
        }
        .led { height: 9px; width: 9px; background: #00ff00; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px #00ff00; margin-left: 8px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<header>
    <div class="nav-wrap">
        <b style="color:var(--navy); font-size: 1.1rem; cursor:pointer;" onclick="nav('home')">GEOTRACKPRO</b>
        <div class="dropdown">
            <button class="btn-v" id="nav-company" style="background:var(--charcoal);">COMPANY ▾</button>
            <div class="drop-content">
                <button onclick="nav('about-us')" id="drop-about">ABOUT US</button>
                <button onclick="nav('partners')" id="drop-partners">PARTNERS</button>
            </div>
        </div>
        <button onclick="nav('home')" class="btn-v" id="nav-home">HOME</button>
    </div>
    <div class="nav-wrap">
        <div class="dropdown">
            <button class="btn-v" id="nav-prod">PRODUCTS ▾</button>
            <div class="drop-content">
                <button onclick="nav('prod-menu')">VIEW CATEGORIES</button>
                <button onclick="renderList('all')">VIEW ALL</button>
                <button onclick="renderList('vehicle')">VEHICLE</button>
                <button onclick="renderList('asset')">ASSET</button>
            </div>
        </div>
        <button onclick="openForm('CONTACT')" class="btn-v" id="nav-contact">CONTACT</button>
        <button onclick="openForm('SALES')" class="btn-v" id="nav-sales">SALES QUERY</button>
        <button onclick="openForm('DEMO')" class="btn-v" id="nav-demo">DEMO REQUEST</button>
        <button onclick="window.open('https://tracksolidpro.com')" class="btn-v" style="background:#059669;">PLATFORM</button>
        <select id="langSelect" onchange="updateLang(this.value)" style="padding:4px; font-weight:800; border-radius:4px; cursor:pointer;">
            <option value="en">EN</option><option value="it">IT</option><option value="es">ES</option><option value="fr">FR</option>
        </select>
    </div>
</header>

<div id="home" class="view active" style="padding:0;">
    <section class="hero">
        <h1 id="h-title" style="font-size: 3.5rem; font-weight: 800; margin:0;">VANGUARD GLOBAL</h1>
        <p style="font-size: 1.1rem; opacity: 0.9; margin-top: 10px;">INDUSTRIAL-GRADE TELEMETRY SOLUTIONS</p>
        <button onclick="nav('prod-menu')" class="btn-v" style="margin-top:30px; padding:15px 40px; font-size:0.8rem;">EXPLORE HARDWARE</button>
    </section>
</div>

<div id="about-us" class="view">
    <div style="max-width: 1000px; margin: 0 auto;">
        <h2 id="ab-title" style="font-size: 2.5rem; border-left: 8px solid var(--accent); padding-left: 20px;"></h2>
        <div class="section-card">
            <p id="ab-p1" style="font-size: 1.1rem; line-height: 1.7; color: #475569;"></p>
        </div>
        <div class="pillar-grid">
            <div class="pillar"><h3 id="ab-m-title"></h3><p id="ab-m-p"></p></div>
            <div class="pillar"><h3 id="ab-g-title"></h3><p id="ab-g-p"></p></div>
            <div class="pillar"><h3 id="ab-s-title"></h3><p id="ab-s-p"></p></div>
        </div>
    </div>
</div>

<div id="contact" class="view">
    <div class="contact-grid">
        <div class="form-area">
            <h2 id="f-title" style="margin-top:0;">CONTACT</h2>
            <form id="contactForm" action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="8c8df878-746f-4fd6-9847-7c1edff3622c">
                <input type="text" name="name" id="in-name" required>
                <input type="text" name="company" id="in-comp" required>
                <input type="email" name="email" id="in-email" required>
                <input type="tel" name="phone" id="in-tel">
                <select name="country" id="in-country" required>
                    <option value="" disabled selected id="opt-country">Country *</option>
                    <option value="Italy">Italy</option><option value="Spain">Spain</option><option value="France">France</option><option value="Other">Other</option>
                </select>
                <textarea name="message" id="in-msg" rows="5" required></textarea>
                <button type="submit" id="btn-submit" class="btn-v" style="width:100%; height:50px; background:var(--accent); font-size:0.8rem;">SEND</button>
            </form>
        </div>
        <div style="background:#eee;">
            <iframe src="https://www.google.com/maps/embed?..." width="100%" height="100%" style="border:0;" loading="lazy"></iframe>
        </div>
    </div>
</div>

<div id="prod-menu" class="view"><div class="pillar-grid" id="cat-anchor"></div></div>
<div id="list-view" class="view"><div class="pillar-grid" id="gridAnchor"></div></div>

<footer>
    <div>© 2026 GEOTRACKPRO | <span id="clock"></span> <span class="led"></span></div>
    <div style="display:flex; gap:15px;"><a href="#" style="color:white; text-decoration:none;">TERMS</a><a href="#" style="color:white; text-decoration:none;">PRIVACY</a></div>
</footer>

<script>
    const TXT = {
        en: { 
            h: "VANGUARD GLOBAL", home: "HOME", company: "COMPANY ▾", about: "ABOUT US", partners: "PARTNERS", prod: "PRODUCTS ▾", contact: "CONTACT", sales: "SALES QUERY", demo: "DEMO REQUEST",
            abT: "THE VANGUARD STANDARD", abP1: "Engineered reliability for enterprise assets. We deliver high-level telemetry hardware built for industrial performance.",
            abMT: "The Mission", abMP: "To eliminate operational variables through uncompromising hardware visibility.", 
            abGT: "Technical Core", abGP: "Utilizing GNSS, LTE, and logic-driven telemetry for superior accuracy.",
            abST: "Expert Support", abSP: "Every deployment is backed by a proactive technical oversight team.",
            fName: "Full Name *", fComp: "Company *", fEmail: "Email *", fTel: "Phone *", fMsg: "How can we help? *", submit: "SEND", country: "Select Country *"
        },
        it: { 
            h: "VANGUARD GLOBALE", home: "HOME", company: "AZIENDA ▾", about: "CHI SIAMO", partners: "PARTNER", prod: "PRODOTTI ▾", contact: "CONTATTI", sales: "VENDITE", demo: "DEMO",
            abT: "LO STANDARD VANGUARD", abP1: "Affidabilità ingegneristica per asset aziendali. Forniamo hardware di alto livello per prestazioni industriali.",
            abMT: "Missione", abMP: "Eliminare le variabili operative tramite una visibilità hardware totale.", 
            abGT: "Core Tecnico", abGP: "Utilizzo di GNSS, LTE e telemetria logica per una precisione superiore.",
            abST: "Supporto", abSP: "Ogni installazione è supportata da un team tecnico proattivo.",
            fName: "Nome *", fComp: "Azienda *", fEmail: "Email *", fTel: "Tel *", fMsg: "Aiuto? *", submit: "INVIA", country: "Paese *"
        }
        // Add ES and FR blocks here following the same structure
    };

    function nav(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        const el = document.getElementById(id);
        if(el) el.classList.add('active');
        window.scrollTo(0,0);
    }

    function updateLang(l) {
        const t = TXT[l] || TXT.en;
        document.getElementById('h-title').innerText = t.h;
        document.getElementById('nav-home').innerText = t.home;
        document.getElementById('nav-company').innerText = t.company;
        document.getElementById('drop-about').innerText = t.about;
        document.getElementById('drop-partners').innerText = t.partners;
        document.getElementById('nav-prod').innerText = t.prod;
        document.getElementById('nav-contact').innerText = t.contact;
        document.getElementById('nav-sales').innerText = t.sales;
        document.getElementById('nav-demo').innerText = t.demo;
        document.getElementById('ab-title').innerText = t.abT;
        document.getElementById('ab-p1').innerText = t.abP1;
        document.getElementById('ab-m-title').innerText = t.abMT; document.getElementById('ab-m-p').innerText = t.abMP;
        document.getElementById('ab-g-title').innerText = t.abGT; document.getElementById('ab-g-p').innerText = t.abGP;
        document.getElementById('ab-s-title').innerText = t.abST; document.getElementById('ab-s-p').innerText = t.abSP;
        document.getElementById('in-name').placeholder = t.fName;
        document.getElementById('in-comp').placeholder = t.fComp;
        document.getElementById('in-email').placeholder = t.fEmail;
        document.getElementById('in-tel').placeholder = t.fTel;
        document.getElementById('in-msg').placeholder = t.fMsg;
        document.getElementById('btn-submit').innerText = t.submit;
        document.getElementById('opt-country').innerText = t.country;
    }

    function openForm(type) { document.getElementById('f-title').innerText = type; nav('contact'); }
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000);
    window.onload = () => { updateLang('en'); };
</script>
</body>
</html>
